<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>创作台</title>
<style>
:root{
  --paper:#f4f0e7; --panel:#fffdf7; --ink:#26231e; --dim:#7d7466; --dim2:#a39a8a;
  --line:#e5ddd0; --line2:#d5cbb9; --accent:#96583a; --accent2:#5f7358;
  --sel:#f0e6d6; --hover:#efe9dd; --chip:#f2ecdf; --shadow:0 1px 3px #4a3a2020;
  --serif:"Songti SC","Source Han Serif SC","Noto Serif SC",Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
}
html[data-theme="night"]{
  --paper:#121419; --panel:#191c22; --ink:#d8d2c5; --dim:#8b8578; --dim2:#66625a;
  --line:#272b33; --line2:#343942; --accent:#c98a5c; --accent2:#8fa383;
  --sel:#232830; --hover:#1e2229; --chip:#232730; --shadow:0 1px 3px #0008;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);overflow:hidden;height:100vh;
  display:flex;flex-direction:column;font:14px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:#96583a33}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600}
a{color:var(--accent);text-decoration:none}

/* 顶栏 */
.top{display:flex;align-items:center;gap:18px;padding:0 18px;height:46px;flex:0 0 auto;
  background:var(--panel);border-bottom:1px solid var(--line);z-index:30}
.logo{font-family:var(--serif);font-size:15px;letter-spacing:.22em;color:var(--accent);white-space:nowrap}
.ptitle{font-family:var(--serif);font-size:14px;color:var(--ink);cursor:pointer;padding:4px 8px;border-radius:4px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.ptitle:hover{background:var(--hover)}
.nav{display:flex;gap:2px;flex:1}
.nav button{background:none;border:0;padding:6px 12px;border-radius:5px;cursor:pointer;color:var(--dim);font-size:13px}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button.on{background:var(--sel);color:var(--accent);font-weight:500}
.kbd{font:11px var(--sans);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;color:var(--dim2)}
.themebtn{background:none;border:1px solid var(--line2);border-radius:5px;padding:4px 10px;cursor:pointer;color:var(--dim);font-size:12px}
.themebtn:hover{background:var(--hover);color:var(--ink)}
.saved{font-size:11px;color:var(--dim2);white-space:nowrap}

/* 通用 */
#view{flex:1;min-height:0;overflow:hidden}
.btn{background:var(--panel);border:1px solid var(--line2);border-radius:5px;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--ink);transition:.12s}
.btn:hover{background:var(--hover);border-color:var(--dim2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff8ef}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover);border-color:transparent}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
input:not([type]),input[type=text],input[type=number],input[type=password],input[type=search],input[type=email],input[type=url],select,textarea{background:var(--panel);border:1px solid var(--line2);border-radius:5px;padding:6px 9px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #96583a18}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:20px;background:var(--chip);color:var(--dim);border:1px solid transparent;white-space:nowrap}
.chip.canon{color:var(--accent2);background:#e8efe4}
html[data-theme=night] .chip.canon{background:#1d2620}
.chip.cut{color:var(--dim2);text-decoration:line-through}
.hint{color:var(--dim);font-size:12.5px;line-height:1.7}
.mini{font-size:11.5px;color:var(--dim2);line-height:1.6}
.empty{color:var(--dim2);text-align:center;padding:48px 16px;font-family:var(--serif);letter-spacing:.08em}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* 写作布局 */
.write{display:grid;grid-template-columns:252px minmax(0,1fr) 288px;height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side .hd{display:flex;align-items:center;gap:6px;padding:12px 12px 8px}
.side .hd b{font-size:11px;letter-spacing:.16em;color:var(--dim2);font-weight:500;flex:1}
.tree{flex:1;overflow-y:auto;padding:0 8px 24px}
.trow{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:13px;color:var(--ink);position:relative}
.trow:hover{background:var(--hover)}
.trow.on{background:var(--sel);color:var(--accent);font-weight:500}
.trow .tw{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tc{font-size:10.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.trow.part{font-family:var(--serif);font-size:12.5px;color:var(--dim);letter-spacing:.06em;margin-top:10px}
.trow .dot{width:5px;height:5px;border-radius:50%;background:var(--line2);flex:none}
.trow.on .dot{background:var(--accent)}
.trow.dragging{opacity:.35}
.trow.over-in{background:var(--sel);outline:2px dashed var(--accent);outline-offset:-2px}
.trow.over-before{box-shadow:inset 0 2px 0 0 var(--accent)}
.trow.over-after{box-shadow:inset 0 -2px 0 0 var(--accent)}
.trow .tt{font-size:9.5px;color:var(--dim2);border:1px solid var(--line);border-radius:3px;padding:0 3px;flex:none;font-family:var(--sans);letter-spacing:0;line-height:1.6}
.trow.empty .tw{color:var(--dim2)}
.trow .tw .mini{font-size:10px;opacity:.7}
.trow .cv{width:21px;height:21px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1;color:var(--dim);cursor:pointer;user-select:none;border-radius:4px}
.trow .cv:hover{color:var(--accent);background:var(--hover)}
.trow .cv.has{color:var(--accent);font-size:11px}
.pimg{max-width:100%;border-radius:6px;margin:10px 0;display:block;border:1px solid var(--line);cursor:zoom-in}
.imgbox{display:inline-flex;align-items:center;gap:8px;margin-top:8px}
.imgbox img{height:40px;border-radius:4px;border:1px solid var(--line)}
.ctxmenu{position:fixed;z-index:9999;min-width:196px;background:var(--panel);border:1px solid var(--line2);border-radius:9px;
  box-shadow:0 12px 34px rgba(0,0,0,.14);padding:5px;font-size:13px;display:none}
.ctxmenu button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:6px 9px;border-radius:6px;
  text-align:left;cursor:pointer;color:var(--ink);font-size:13px}
.ctxmenu button:hover{background:var(--hover)}
.ctxmenu .sep{height:1px;background:var(--line);margin:4px 3px}
.ctxmenu .mini{padding:4px 9px 3px}
.ctxmenu .ic{width:14px;text-align:center;color:var(--dim2);flex:none}
.prose.edit{white-space:pre-wrap;word-break:break-word}
.prose.edit:empty::before{content:attr(data-ph);color:var(--dim2)}
.ce-ref{display:inline-block;padding:0 5px;margin:0 2px;border:1px solid var(--accent);border-radius:4px;background:var(--chip);
  color:var(--accent);font-size:.92em;line-height:1.55;vertical-align:baseline;cursor:pointer;user-select:none}
.ce-img{display:block;max-width:100%;border-radius:6px;margin:10px 0;border:1px solid var(--line);cursor:zoom-in}

.main{overflow-y:auto;padding:30px 40px 80px;background:var(--paper)}
.sheet{max-width:720px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:44px 52px 36px;box-shadow:var(--shadow)}
.sheet .nodebar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sheet input.title{font-family:var(--serif);font-size:25px;line-height:1.35;border:0;background:transparent;padding:0;margin-bottom:6px}
.sheet input.title:focus{box-shadow:none;border:0}
.sheet textarea.prose,.sheet .prose.edit{font-family:var(--serif);font-size:17px;line-height:2;border:0;background:transparent;padding:0;
  min-height:52vh;resize:none;margin-top:14px;letter-spacing:.01em;color:var(--ink);width:100%;outline:none}
.sheet textarea.prose:focus,.sheet .prose.edit:focus{box-shadow:none;border:0}
.sheet .foot{display:flex;align-items:center;gap:14px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim2)}
.preview{font-family:var(--serif);font-size:17px;line-height:2;margin-top:14px;white-space:normal}
.preview p{margin:0 0 1em}
.preview .ref{display:inline-block;padding:0 6px;margin:0 1px;border:1px solid var(--accent);border-radius:4px;background:var(--chip);
  color:var(--accent);font-size:.92em;line-height:1.6;cursor:pointer;text-decoration:none;vertical-align:baseline}
.preview .ref:hover{background:var(--accent);color:#fff8ef}
.refbox{display:inline-flex;align-items:center;gap:4px;padding:0 5px;border:1px solid var(--accent);border-radius:4px;
  background:var(--chip);color:var(--accent);font-size:.9em;line-height:1.7;margin:0 2px}
.preview .men{background:#96583a14;border-radius:2px;padding:0 1px}

.ctx{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px 16px 40px}
.ctx h4{font-size:10.5px;letter-spacing:.16em;color:var(--dim2);font-weight:500;margin:18px 0 7px}
.ctx h4:first-child{margin-top:2px}
.ctx .row{font-size:12.5px;line-height:1.6;padding:3px 0;color:var(--dim)}
.ctx .row b{color:var(--ink);font-weight:500;cursor:pointer}
.ctx .row b:hover{color:var(--accent)}
.ctx .note{font-size:12px;color:var(--dim);background:var(--chip);border-radius:5px;padding:8px 10px;line-height:1.65}
.ctx .warn{color:var(--accent);background:#96583a12}

/* 大纲 */
.out{padding:28px 36px 80px;overflow-y:auto;height:100%}
.outhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.outhead h2{font-family:var(--serif);font-size:21px;letter-spacing:.06em}
.outhead p{margin:2px 0 0;color:var(--dim);font-size:12.5px}
.curve{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px 6px;margin-bottom:18px}
.curve svg{display:block;width:100%;height:120px}
.partblk{margin-bottom:22px}
.partblk>.ph{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.partblk>.ph b{font-family:var(--serif);font-size:16px;letter-spacing:.06em}
.partblk>.ph span{font-size:11px;color:var(--dim2)}
.chap{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.chap>.ch{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
.chap>.ch:hover{background:var(--hover)}
.chap>.ch .no{font-family:var(--serif);color:var(--accent);font-size:12px;width:42px;flex:none;font-variant-numeric:tabular-nums}
.chap>.ch b{font-family:var(--serif);font-size:15px;font-weight:600}
.chap>.ch .sum{color:var(--dim);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chap>.ch .wc{font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums}
.bars{display:flex;gap:2px;flex:none}
.bars i{width:5px;height:12px;border-radius:1px;background:var(--line2);display:block}
.bars i.on{background:var(--accent)}
.scenes{border-top:1px solid var(--line);padding:4px 0 8px}
.sc{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 56px;font-size:12.5px;color:var(--dim);cursor:pointer}
.sc:hover{background:var(--hover)}
.sc b{color:var(--ink);font-weight:500}
.sc .f{font-size:10.5px;color:var(--accent2);background:#e8efe4;border-radius:3px;padding:1px 5px}
html[data-theme=night] .sc .f{background:#1d2620}
.func{display:inline-flex;gap:3px}
.func button{border:1px solid var(--line2);background:transparent;border-radius:3px;font-size:10.5px;padding:1px 6px;cursor:pointer;color:var(--dim)}
.func button.on{background:var(--accent);border-color:var(--accent);color:#fff8ef}

/* 设定库 */
.lib{display:grid;grid-template-columns:196px minmax(0,1fr);height:100%}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;overflow-y:auto}
.rail h4{font-size:10.5px;letter-spacing:.16em;color:var(--dim2);font-weight:500;margin:0 8px 6px}
.rit{display:flex;justify-content:space-between;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:13px;color:var(--dim)}
.rit:hover{background:var(--hover);color:var(--ink)}
.rit.on{background:var(--sel);color:var(--accent);font-weight:500}
.rit em{font-style:normal;color:var(--dim2);font-size:11px}
.libmain{overflow-y:auto;padding:24px 30px 80px}
.libbar{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 15px;cursor:pointer;box-shadow:var(--shadow);transition:.12s}
.card:hover{transform:translateY(-1px);border-color:var(--line2)}
.card .t{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.card .t b{font-family:var(--serif);font-size:15px;font-weight:600}
.card .t i{font-style:normal;font-size:12px;color:var(--accent)}
.card .x{font-size:12.5px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.6;min-height:2.6em}
.card .f{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

/* 抽屉 */
#drawer{position:fixed;top:46px;right:0;bottom:0;width:min(600px,94vw);background:var(--panel);border-left:1px solid var(--line2);
  transform:translateX(102%);transition:transform .22s ease;z-index:60;display:flex;flex-direction:column;box-shadow:-20px 0 50px #3a2a1220}
#drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.db{flex:1;overflow-y:auto;padding:16px 18px}
.df{display:flex;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);flex:0 0 auto}
.db h5{font-size:10.5px;letter-spacing:.16em;color:var(--dim2);margin:18px 0 8px;font-weight:500;border-bottom:1px solid var(--line);padding-bottom:5px}
.db h5:first-child{margin-top:0}
.blk{border:1px solid var(--line);border-radius:6px;padding:8px 9px;margin-bottom:8px;background:var(--panel)}
.blk .row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.blk .row input{flex:1;min-width:0;width:auto;font-size:13px;padding:4px 7px}
.blk .row input.mini{font-size:12.5px}
.blk .tx{width:100%;min-height:40px;font-size:13px;resize:vertical}
.blk .row .chip{flex:none}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:11.5px;color:var(--dim);margin-bottom:4px;letter-spacing:.04em}

/* 弹层 */
#modal{position:fixed;inset:0;background:#2a201088;display:none;align-items:flex-start;justify-content:center;z-index:90;padding:12vh 20px 20px}
#modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:10px;width:min(620px,96vw);max-height:74vh;display:flex;flex-direction:column;box-shadow:0 24px 60px #3a2a1230}
.mbox .mh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.mbox .mb{padding:14px 16px;overflow:auto}
.mbox .mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
#palette{position:fixed;inset:0;background:#2a201066;display:none;align-items:flex-start;justify-content:center;z-index:95;padding:14vh 20px 20px}
#palette.on{display:flex}
.pbox{background:var(--panel);border:1px solid var(--line2);border-radius:10px;width:min(600px,96vw);overflow:hidden;box-shadow:0 24px 60px #3a2a1230}
.pbox input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;font-size:15px}
.pres{max-height:56vh;overflow:auto}
.pitem{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;font-size:13px}
.pitem:hover,.pitem.on{background:var(--hover)}
.pitem .k{font-size:10.5px;color:var(--dim2);width:46px;flex:none}
.pitem b{font-weight:500}
.pitem span{color:var(--dim2);font-size:11.5px;margin-left:auto}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--ink);color:var(--paper);
  padding:8px 16px;border-radius:20px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:120}
#toast.on{opacity:1;transform:translate(-50%,0)}
#errbar{position:fixed;top:0;left:0;right:0;background:#8b2f22;color:#ffe4dc;padding:6px 14px;font-size:12px;z-index:200;display:none;white-space:pre-wrap;max-height:32vh;overflow:auto}
#errbar.on{display:block}
.ptl{font-family:var(--serif);font-size:14px;line-height:1.85;max-height:46vh;overflow:auto;background:var(--chip);border-radius:6px;padding:12px}
/* 专注模式 */
.write.zen{grid-template-columns:0 minmax(0,1fr) 0}
.write.zen .side,.write.zen .ctx{display:none}
.write.zen .sheet{max-width:820px}
@media (max-width:1180px){
  .write{grid-template-columns:232px minmax(0,1fr)}
  .ctx{display:none}
}
@media (max-width:860px){
  .write{grid-template-columns:0 minmax(0,1fr)}
  .side{display:none}
  .main{padding:20px 16px 60px}
  .sheet{padding:28px 22px 24px}
}

/* 地图 */
.boardpage{display:flex;flex-direction:column;height:100%}
.boardpage .mapwrap{flex:1;min-height:0;height:auto}
.mtoolbar{display:flex;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel);align-items:center;flex:0 0 auto}
.mapwrap{overflow:auto;height:calc(100vh - 92px);background:var(--paper)}
.mapcanvas{position:relative;width:1800px;height:1300px;
  background-color:var(--paper);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:40px 40px;background-position:-1px -1px}
.mregion{position:absolute;border:1px dashed var(--line2);background:var(--chip);border-radius:16px;cursor:move}
.mregion .rl{position:absolute;left:14px;top:9px;font-family:var(--serif);font-size:13px;color:var(--dim);cursor:text}
.mregion .rx{position:absolute;right:8px;top:6px;font-size:12px;color:var(--dim2);cursor:pointer;padding:2px 4px}
.mregion .rx:hover{color:var(--accent)}
.mregion .mhandle{position:absolute;right:-7px;bottom:-7px;width:15px;height:15px;border-radius:50%;background:var(--accent);cursor:nwse-resize;border:2px solid var(--panel)}
.mnode{position:absolute;width:142px;padding:8px 10px;background:var(--panel);border:1px solid var(--line2);border-radius:9px;
  box-shadow:var(--shadow);cursor:grab;user-select:none;z-index:3}
.mnode:hover{border-color:var(--accent)}
.mnode.orph{border-style:dashed;opacity:.66}
.mnode.pick{border-color:var(--accent);box-shadow:0 0 0 3px #96583a22}
.mnode .mn{font-family:var(--serif);font-size:13.5px;line-height:1.3;display:flex;align-items:center;gap:5px}
.mnode .mt{font-size:10.5px;color:var(--dim2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapedge{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
.mapedge .line{stroke:var(--line2);stroke-width:1.6;fill:none}
.mapedge .line.sel{stroke:var(--accent);stroke-width:2.2}
.mapedge .elab{font-size:10.5px;fill:var(--dim);font-family:var(--sans)}
.mapedge .hit{stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.charcards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(186px,1fr))}
.charcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 14px;cursor:pointer;text-align:center;box-shadow:var(--shadow);transition:.12s}
.charcard:hover{transform:translateY(-2px);border-color:var(--line2)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--chip);overflow:hidden;flex:none;line-height:1;user-select:none}
.av img{width:100%;height:100%;object-fit:cover}
.charcard .nm{font-family:var(--serif);font-size:15.5px;margin-top:10px}
.charcard .rl{font-size:11.5px;color:var(--dim);margin-top:2px;min-height:1.5em}
.charcard .qq{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.dossier{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;align-items:start}
.dleft{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 18px;text-align:center;position:sticky;top:16px;box-shadow:var(--shadow)}
.dleft .nm{font-family:var(--serif);font-size:19px;margin-top:12px}
.dleft input{text-align:center}
.dright{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 26px;box-shadow:var(--shadow)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:2px;gap:2px}
.seg button{background:none;border:0;padding:4px 13px;border-radius:6px;cursor:pointer;color:var(--dim);font-size:12.5px}
.seg button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}
.avatargrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-bottom:14px}
.avatargrid button{font-size:19px;padding:5px 0;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;line-height:1.3}
.avatargrid button:hover{background:var(--hover)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.swatches i{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:block}
.swatches i.on{border-color:var(--ink)}
.relrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.relrow b{color:var(--ink);cursor:pointer;font-weight:500}
.relrow span{color:var(--dim2)}
/* 脉络表 */
.mxwrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
table.mx{border-collapse:collapse;width:100%;font-size:12.5px}
table.mx th,table.mx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
table.mx th{font-weight:500;color:var(--dim);text-align:left;background:var(--chip);padding:8px 10px;white-space:nowrap}
table.mx td.ch{font-family:var(--serif);padding:7px 10px;white-space:nowrap;min-width:150px;position:sticky;left:0;background:var(--panel)}
table.mx td.ch span{color:var(--accent);font-size:11px;margin-right:6px}
table.mx td input{border:0;background:transparent;padding:7px 8px;font-size:12.5px;border-radius:0;width:100%;min-width:120px}
table.mx td input:focus{background:var(--chip);box-shadow:none}
/* 时间线 */
.tl{position:relative;padding-left:28px}
.tl:before{content:"";position:absolute;left:8px;top:10px;bottom:10px;width:1px;background:var(--line2)}
.tlrow{position:relative;display:flex;gap:8px;align-items:center;padding:5px 0}
.tlrow:before{content:"";position:absolute;left:-24px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--paper)}
.tlrow input{border:0;background:transparent;padding:5px 6px}
.tlrow input:hover{background:var(--hover)}
.tlrow .t{width:130px;color:var(--accent);font-size:12px;flex:none}
.tlrow .ti{font-family:var(--serif);font-size:14px;flex:1}
.tlrow .ch{width:118px;font-size:12px;color:var(--dim);flex:none}
</style>
</head>
<body>
<header class="top">
  <div class="logo">创作台</div>
  <div class="ptitle" id="ptitle" data-act="rename">未命名</div>
  <nav class="nav" id="nav"></nav>
  <span class="saved" id="saved"></span>
  <span class="kbd" data-act="openPalette" style="cursor:pointer">Ctrl K</span>
  <button class="themebtn" data-act="theme">夜</button>
</header>
<main id="view"></main>
<aside id="drawer"></aside>
<div id="modal"></div>
<div id="palette"><div class="pbox"><input id="pq" type="text" placeholder="搜索章节、人物、词条…" autocomplete="off"><div class="pres" id="pres"></div></div></div>
<div id="toast"></div>
<div id="errbar"></div>

<script>
'use strict';
const KEY='story-desk.v1';
const SN='story-desk.snap';
let DB=null;

/* ---------- 词条类型 ---------- */
const ET={
  char:    {label:'人物', icon:'◉', fields:[['身份','text'],['年龄','text'],['外形','area'],['声音','area'],['欲望','area'],['恐惧','area'],['缺陷','area'],['创伤','area'],['秘密','area'],['弧光','area'],['口癖','area'],['结局','text']]},
  world:   {label:'世界', icon:'◈', fields:[['一句话','text'],['法则','area'],['禁忌','area'],['代价','area']]},
  place:   {label:'地点', icon:'▣', fields:[['概貌','area'],['感官','area'],['历史','area'],['危险','area']]},
  faction: {label:'势力', icon:'⬢', fields:[['目的','area'],['手段','area'],['秘密','area']]},
  rule:    {label:'规则', icon:'✳', fields:[['触发','area'],['表现','area'],['后果','area'],['破解','area']]},
  item:    {label:'器物', icon:'⌗', fields:[['来历','area'],['作用','area'],['象征','area']]},
  creature:{label:'异象', icon:'☠', fields:[['外形','area'],['行为','area'],['弱点','area'],['象征','area']]},
  term:    {label:'名词', icon:'❖', fields:[['释义','area'],['出处','text']]}
};
const EK=Object.keys(ET);
const ES={draft:{label:'草稿'},canon:{label:'正典'},cut:{label:'废弃'}};
const FUNCS=['建立','推进','转折','揭示','喘息','收束'];
const NT={part:{label:'幕'},chapter:{label:'章'},scene:{label:'场景'}};
function formMode(){ return (DB.meta&&DB.meta.form)||'novel'; }
function typeLabel(n){
  if(!n) return '';
  if(n.type==='part') return '幕';
  if(n.type==='chapter') return '章';
  const m=formMode();
  return m==='novel'?'节':(m==='script'?'场':'场景');
}

/* ---------- 工具 ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'')+Math.random().toString(36).slice(2,9);
const now=()=>Date.now();
const dt=t=>{if(!t)return '—';const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());};
const today=()=>dt(now()).slice(0,10);
const clip=(s,n)=>{s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n)+'…':s;};
const chars=s=>String(s||'').replace(/\[\[|\]\]/g,'').replace(/\s/g,'').length;

/* ---------- 头像 ---------- */
const AV_ICONS=['🕵️','🧑‍🎤','👤','🧙','🧛','🧟','👻','💀','🦌','🐦','🕯️','📻','🔪','🗝️','🪞','🚪','🌫️','🩸','🦷','🐍','🕷️','🦋','🌘','👁️','🧵','⚰️','🪦','🔥','💧','📼','📷','🪟','🧊','🌾','🐺','🦉','🎭','🃏','🎼','⏳'];
const AV_COLORS=['#c2776a','#b0955e','#7f9b86','#6f93a8','#9d7fa8','#8a93a8','#a89678','#8d7f7c'];
function avatarHTML(e,size){
  const a=(e&&e.avatar)||{};
  const s=size||44, ico=a.icon||'👤';
  if(a.img) return '<span class="av" style="width:'+s+'px;height:'+s+'px"><img src="'+a.img+'" alt=""></span>';
  const bg=a.bg||AV_COLORS[0];
  return '<span class="av" style="width:'+s+'px;height:'+s+'px;font-size:'+Math.round(s*0.5)+'px;background:'+bg+'26;border:1px solid '+bg+'55">'+ico+'</span>';
}
function charEntries(){ return DB.entries.filter(e=>e.type==='char'); }

function nodeBy(id){ return DB.nodes.find(n=>n.id===id); }
function entryBy(id){ return DB.entries.find(e=>e.id===id); }
function entryByTitle(t){
  const k=String(t||'').trim().toLowerCase();
  if(!k) return null;
  return DB.entries.find(e=>e.title.trim().toLowerCase()===k) ||
         DB.entries.find(e=>(e.alias||[]).some(a=>a.trim().toLowerCase()===k)) || null;
}
function children(id){ return DB.nodes.filter(n=>n.parentId===id).sort((a,b)=>(a.order||0)-(b.order||0)); }
function roots(){ return children(null); }
function chapters(){
  const out=[];
  roots().forEach(r=>{
    if(r.type==='part') children(r.id).forEach(c=>{ if(c.type==='chapter') out.push(c); });
    else if(r.type==='chapter') out.push(r);
  });
  DB.nodes.forEach(n=>{
    if(n.type!=='chapter') return;
    if(out.some(x=>x.id===n.id)) return;
    const p=n.parentId?nodeBy(n.parentId):null;
    if(!p) out.push(n);
  });
  return out;
}
function cnNum(n){
  const d='零一二三四五六七八九';
  if(n<=10) return n===10?'十':d.charAt(n);
  if(n<20) return '十'+d.charAt(n-10);
  const t=Math.floor(n/10), r=n%10;
  return d.charAt(t)+'十'+(r?d.charAt(r):'');
}
function orderedChapters(){
  const out=[];
  roots().forEach(r=>{
    if(r.type==='part'){ out.push(r); children(r.id).forEach(c=>{ if(c.type==='chapter') out.push(c); }); }
    else if(r.type==='chapter') out.push(r);
  });
  return out;
}
function totalWords(){ return chapters().reduce((s,c)=>s+chars(c.text),0); }
function treePath(n){
  const p=[]; let cur=n;
  while(cur){ p.unshift(cur); cur=cur.parentId?nodeBy(cur.parentId):null; }
  return p;
}
function keyTerms(){
  const out=[];
  DB.entries.forEach(e=>{ if(e.title.trim()) out.push({e:e,k:e.title.trim()}); (e.alias||[]).forEach(a=>{ if(a.trim()) out.push({e:e,k:a.trim()}); }); });
  return out.sort((a,b)=>b.k.length-a.k.length);
}
function mentions(text){
  const res=[];
  keyTerms().forEach(t=>{ if(t.k && String(text||'').indexOf(t.k)>=0) res.push(t); });
  return res;
}
function refs(text){
  const m=String(text||'').match(/\[\[([^\]]+)\]\]/g)||[];
  return m.map(x=>x.replace(/^\[\[|\]\]$/g,'').trim());
}
function nodesReferencing(title){
  return DB.nodes.filter(n=>refs(n.text).some(t=>t.toLowerCase()===String(title).trim().toLowerCase()));
}
function nodesMentioning(title){
  return DB.nodes.filter(n=>String(n.text||'').indexOf(title)>=0 || refs(n.text).some(t=>t===title));
}
function snippetAround(text,idx,len){
  const raw=String(text||'');
  const start=Math.max(0,idx-12), end=Math.min(raw.length,idx+len+12);
  return (start>0?'…':'')+raw.slice(start,end).replace(/\s+/g,' ')+(end<raw.length?'…':'');
}
function appearancesOf(e){
  const keys=[e.title].concat(e.alias||[]).filter(Boolean);
  const cs=chapters(), out=[];
  DB.nodes.forEach(n=>{
    if(n.type!=='chapter'&&n.type!=='scene') return;
    const txt=String(n.text||'');
    if(!txt) return;
    for(let i=0;i<keys.length;i++){
      const k=keys[i], at=txt.indexOf(k);
      if(at>=0){ out.push({node:n,key:k,snippet:snippetAround(txt,at,k.length),order:cs.indexOf(n)}); break; }
    }
  });
  out.sort((a,b)=>a.order-b.order);
  return out;
}
function prevChapter(n){
  const list=chapters();
  const i=list.findIndex(c=>c.id===n.id);
  return i>0?list[i-1]:null;
}

/* ---------- 数据 ---------- */
function blankEntry(type){
  return {id:uid('e_'),type:type||'term',title:'',alias:[],status:'draft',tags:[],fields:{},body:'',createdAt:now(),updatedAt:now()};
}
function blankNode(type,parentId){
  return {id:uid('n_'),type:type,parentId:parentId||null,order:999,title:'',func:'',intensity:0,summary:'',text:'',status:'draft',createdAt:now(),updatedAt:now()};
}
function emptyDB(){
  return {v:2,
    meta:{title:'未命名',logline:'',genre:'',form:'novel',targetWords:60000},
    entries:[],nodes:[],rels:[],events:[],threads:[],dialogues:[],quests:[],
    ui:{tab:'write',nodeId:null,entryId:null,charId:null,dlgId:null,questId:null,theme:'paper',filter:'',q:'',preview:false,zen:false,sub:'outline'}};
}
/* 旧版本里带 demo 标记的示例内容，加载时自动剥离，保留用户自己写的东西 */
function stripDemo(d){
  if(!d||!Array.isArray(d.nodes)||!Array.isArray(d.entries)) return d;
  const dn={},de={};
  d.nodes.forEach(function(n){ if(n.demo) dn[n.id]=1; });
  d.entries.forEach(function(e){ if(e.demo) de[e.id]=1; });
  if(!Object.keys(dn).length&&!Object.keys(de).length) return d;
  d.nodes=d.nodes.filter(function(n){ return !n.demo; });
  d.entries=d.entries.filter(function(e){ return !e.demo; });
  d.rels=(d.rels||[]).filter(function(r){ return !de[r.a]&&!de[r.b]; });
  d.events=(d.events||[]).filter(function(e){ return !(e.chapterId&&dn[e.chapterId]); });
  d.threads=(d.threads||[]).map(function(t){
    const c={};
    Object.keys(t.cells||{}).forEach(function(k){ if(!dn[k]) c[k]=t.cells[k]; });
    return Object.assign({},t,{cells:c});
  });
  if(d.ui){
    if(dn[d.ui.nodeId]) d.ui.nodeId=null;
    if(de[d.ui.charId]) d.ui.charId=null;
    if(de[d.ui.entryId]) d.ui.entryId=null;
  }
  if(d.meta&&/^沈湾/.test(String(d.meta.title||''))){
    d.meta=Object.assign({},d.meta,{title:'未命名',logline:'',genre:''});
  }
  d.__cleaned=true;
  return d;
}

/* ---------- 存储 ---------- */
let storageOK=true,lastSave=0,saveTimer=null;
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return emptyDB();
    const d=JSON.parse(raw);
    if(!d||!Array.isArray(d.entries)||!Array.isArray(d.nodes)) return emptyDB();
    return stripDemo(d);
  }catch(e){ storageOK=false; return emptyDB(); }
}
function persist(){
  try{ localStorage.setItem(KEY,JSON.stringify(DB)); lastSave=now(); paintSaved(); }
  catch(e){ storageOK=false; warn('保存失败：'+e.message+'（请导出备份）'); }
  try{ bkMaybe(); }catch(e){}
}
function touch(){ if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(persist,600); const el=$('#saved'); if(el&&storageOK) el.textContent='…'; }
function paintSaved(){
  const el=$('#saved'); if(!el) return;
  if(!storageOK){ el.textContent='⚠ 未保存'; return; }
  const vn=(DB&&DB.sync&&DB.sync.lastVersion)?('v'+DB.sync.lastVersion+' · '):'';
  el.textContent=lastSave?(vn+'已保存 '+new Date(lastSave).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})):'本地';
}
function snapshot(reason){ makeVersion(reason||'自动'); }

/* ---------- 版本存档 ---------- */
const VKEY='story-desk.versions';
function versions(){ try{ return JSON.parse(localStorage.getItem(VKEY)||'[]'); }catch(e){ return []; } }
function saveVersions(l){ try{ localStorage.setItem(VKEY,JSON.stringify(l)); }catch(e){ warn('版本写不进去（本地空间可能满了）：'+e.message); } }
function makeVersion(label){
  try{
    const list=versions();
    const n=((list[0]&&list[0].n)||0)+1;
    const data=JSON.stringify({v:2,meta:DB.meta,entries:DB.entries,nodes:DB.nodes,rels:DB.rels||[],
      events:DB.events||[],threads:DB.threads||[],dialogues:DB.dialogues||[],quests:DB.quests||[],map:DB.map||{}});
    list.unshift({n:n,at:now(),label:label||'',words:totalWords(),chapters:chapters().length,data:data});
    let total=0;
    const keep=[];
    list.forEach(v=>{ total+=v.data.length; if(keep.length<12&&total<3.2*1024*1024) keep.push(v); });
    saveVersions(keep);
    if(!DB.sync) DB.sync={};
    DB.sync.lastVersion=n;
    persist();
    return n;
  }catch(e){ warn('存档失败：'+e.message); return 0; }
}
function versionDiff(n){
  const v=versions().find(x=>x.n===n);
  if(!v) return null;
  let old;
  try{ old=JSON.parse(v.data); }catch(e){ return null; }
  const pick=d=>{ const m={}; (d.nodes||[]).forEach(x=>{ if(x.type==='chapter') m[x.id]=x; }); return m; };
  const o=pick(old), c=pick(DB);
  const ids=Object.keys(o).concat(Object.keys(c).filter(id=>!o[id]));
  const rows=[];
  ids.forEach(id=>{
    const a=o[id], b=c[id];
    if(a&&!b) rows.push({t:'del',title:a.title,old:chars(a.text),now:0});
    else if(!a&&b) rows.push({t:'add',title:b.title,old:0,now:chars(b.text)});
    else if(String(a.text||'')!==String(b.text||'')) rows.push({t:'mod',title:b.title,old:chars(a.text),now:chars(b.text)});
  });
  return {n:n,at:v.at,label:v.label,rows:rows,
    oldWords:v.words,nowWords:totalWords(),oldCh:v.chapters,nowCh:chapters().length,
    dEntries:(DB.entries||[]).length-((old.entries||[]).length),
    dDlg:(DB.dialogues||[]).length-((old.dialogues||[]).length),
    dQuest:(DB.quests||[]).length-((old.quests||[]).length)};
}
function showDiff(n){
  const d=versionDiff(n);
  if(!d) return warn('这一版读不出来');
  const sgn=x=>x>0?'+'+x:(x<0?String(x):'0');
  let b='<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;margin-bottom:14px">'
    +'<span>字数 <b>'+d.oldWords+' → '+d.nowWords+'</b>（'+sgn(d.nowWords-d.oldWords)+'）</span>'
    +'<span>章 <b>'+d.oldCh+' → '+d.nowCh+'</b></span>'
    +'<span>词条 '+sgn(d.dEntries)+'</span>'
    +'<span>对话 '+sgn(d.dDlg)+'</span>'
    +'<span>任务 '+sgn(d.dQuest)+'</span></div>';
  b+=d.rows.length
    ? '<div>'+d.rows.map(r=>'<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px">'
        +'<span class="chip">'+({add:'新增',del:'删除',mod:'修改'})[r.t]+'</span>'
        +'<b style="flex:1;font-weight:500">'+esc(r.title||'（未命名）')+'</b>'
        +'<span class="mini">'+r.old+' → '+r.now+' 字（'+sgn(r.now-r.old)+'）</span></div>').join('')+'</div>'
    : '<div class="hint">正文和这一版完全一样，改的是设定、对话或任务。</div>';
  modal('对比 v'+d.n+'（'+dt(d.at)+'）→ 现在', b, '<button class="btn" data-act="closeModal">关闭</button>');
}
function restoreVersion(n){
  const v=versions().find(x=>x.n===n);
  if(!v) return;
  if(!confirm('回到 v'+n+'（'+dt(v.at)+'）？\n当前内容会先存成一个新版本。')) return;
  makeVersion('恢复前');
  try{ DB=JSON.parse(v.data); }catch(e){ return warn('这个版本读不出来'); }
  DB.ui=Object.assign({tab:'write',nodeId:null,entryId:null,charId:null,dlgId:null,questId:null,charBoard:false,libBoard:false,itemSrv:'',itemSel:null,itemQ:'',theme:'paper',filter:'',q:'',preview:false,zen:false,sub:'outline'},DB.ui||{});
  if(!DB.sync) DB.sync={};
  DB.sync.lastVersion=n;
  DB.entries=(DB.entries||[]).map(fixEntry).filter(Boolean);
  DB.nodes=(DB.nodes||[]).map(fixNode).filter(Boolean);
  if(!Array.isArray(DB.dialogues)) DB.dialogues=[];
  if(!Array.isArray(DB.quests)) DB.quests=[];
  if(!DB.ui.nodeId||!nodeBy(DB.ui.nodeId)) DB.ui.nodeId=(chapters()[0]||{}).id||null;
  persist(); render();
  toast('已回到 v'+n);
}
function snaps(){ return versions(); }

/* ---------- 小部件 ---------- */
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }
function warn(m){ const b=$('#errbar'); b.textContent=m; b.classList.add('on'); clearTimeout(b._h); b._h=setTimeout(()=>b.classList.remove('on'),9000); }
function modal(title,body,foot,wide){
  $('#modal').innerHTML='<div class="mbox" style="'+(wide?'width:min(1000px,96vw)':'')+'"><div class="mh"><b>'+esc(title)+'</b></div><div class="mb">'+(body||'')+'</div><div class="mf">'+(foot||'<button class="btn" data-act="closeModal">关闭</button>')+'</div></div>';
  $('#modal').classList.add('on');
}
function closeModal(){ $('#modal').classList.remove('on'); $('#modal').innerHTML=''; }

/* ---------- 检查 ---------- */
function checks(){
  const out=[];
  if(!chapters().length) out.push({lv:'warn',t:'还没有章节',s:'点左边「＋ 章」开始'});
  chapters().forEach(c=>{
    if(!String(c.text||'').trim()) out.push({lv:'warn',t:'这章还没有正文：'+c.title,s:'只有大纲也可以，但记得回来写'});
    else if(!c.func) out.push({lv:'warn',t:'这章没有功能标签：'+c.title,s:'标注「推进/转折/揭示」能看出节奏'});
  });
  const titles=new Set(DB.entries.map(e=>e.title.trim()).filter(Boolean));
  DB.nodes.forEach(n=>{
    refs(n.text).forEach(t=>{ if(!entryByTitle(t)) out.push({lv:'bad',t:'引用了不存在的词条：[['+t+']]',s:'在「设定」里新建，或者改掉这个引用'}); });
  });
  DB.entries.forEach(e=>{
    if(e.status==='canon'){
      const miss=[];
      if(e.type==='char') ['欲望','缺陷','秘密'].forEach(f=>{ if(!String(e.fields[f]||'').trim()) miss.push(f); });
      if(miss.length) out.push({lv:'warn',t:'正典人物缺关键项：'+e.title,s:'缺 '+miss.join('、')});
      const watch=['char','place','item','creature','faction'];
      if(watch.indexOf(e.type)>=0 && !nodesMentioning(e.title).length && !(e.alias||[]).some(a=>a&&nodesMentioning(a).length))
        out.push({lv:'warn',t:'正典词条从没被写过：'+e.title,s:'正文里一次都没出现'});
    }
  });
  (DB.dialogues||[]).forEach(d=>{
    if(!(d.lines||[]).some(l=>String(l.tx||'').trim()))
      out.push({lv:'warn',t:'对话没有台词：'+(d.title||'未命名'),s:'点开写几句'});
    if(!d.npcId) out.push({lv:'warn',t:'对话没指定角色：'+(d.title||'未命名'),s:'指定它属于谁'});
  });
  (DB.quests||[]).forEach(q=>{
    if(!String(q.goal||'').trim()) out.push({lv:'warn',t:'任务没写目标：'+(q.title||'未命名'),s:'一句话说清要他做什么'});
    if(!(q.steps||[]).length) out.push({lv:'warn',t:'任务没有步骤：'+(q.title||'未命名'),s:'至少加一步'});
    if(q.chapterId&&!nodeBy(q.chapterId)) out.push({lv:'warn',t:'任务挂在不存在的章：'+(q.title||'未命名'),s:'重新选一个关联章节'});
  });
  if(!out.length) out.push({lv:'ok',t:'没有发现明显问题',s:'继续写'});
  return out;
}

function assetById(id){ return (DB.assets||[]).find(x=>x.id===id)||null; }
function assetsSize(){ return (DB.assets||[]).reduce((s,a)=>s+(a.size||0),0); }
function compressImage(file,cb){
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=1400;
      const s=Math.min(1,max/Math.max(img.width||1,img.height||1));
      const w=Math.max(1,Math.round((img.width||1)*s));
      const h=Math.max(1,Math.round((img.height||1)*s));
      const c=document.createElement('canvas');
      c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      let url='';
      try{ url=c.toDataURL('image/webp',0.82); }catch(e){ url=''; }
      if(!url||url.indexOf('data:image/webp')!==0) url=c.toDataURL('image/jpeg',0.85);
      const bytes=Math.round(url.length*0.75);
      if(bytes>2500000) return cb(null,'这张图压缩后还是太大（'+Math.round(bytes/1024)+' KB），换一张小点的');
      cb({dataUrl:url,w:w,h:h,size:bytes});
    };
    img.onerror=()=>cb(null,'这张图片读不出来');
    img.src=r.result;
  };
  r.onerror=()=>cb(null,'文件读取失败');
  r.readAsDataURL(file);
}
function insertIntoText(tok){
  const n=curNode(); if(!n) return;
  const el=ceEl();
  if(el&&el.isContentEditable){
    el.focus();
    if(tok.indexOf('{{img:')===0){
      const id=tok.slice(6,-2);
      document.execCommand('insertHTML',false,ceImg(id));
    }else{
      document.execCommand('insertText',false,tok);
    }
    syncCE();
    return;
  }
  const ta=$('#eText');
  if(ta&&typeof ta.selectionStart==='number'){
    const s=ta.selectionStart, e=ta.selectionEnd;
    ta.value=ta.value.slice(0,s)+tok+ta.value.slice(e);
    n.text=ta.value;
    const p=s+tok.length;
    ta.focus(); try{ ta.setSelectionRange(p,p); }catch(x){}
    if(typeof autoGrow==='function') autoGrow(ta);
  }else{
    n.text=(n.text||'')+(n.text?'\n\n':'')+tok;
  }
  n.updatedAt=now(); touch();
}
function addImageFile(file){
  if(!file||String(file.type||'').indexOf('image/')!==0) return warn('只能插图片');
  compressImage(file,(res,err)=>{
    if(err) return warn(err);
    DB.assets=DB.assets||[];
    if(assetsSize()+res.size>2500000) return warn('图片总量快到上限了（约 2.5 MB）。浏览器本地存储只有 5 MB 左右，先删几张再插');
    const a={id:'im'+Date.now().toString(36)+(Math.floor(Math.random()*900)+100),name:file.name||'图片',dataUrl:res.dataUrl,w:res.w,h:res.h,size:res.size,at:now()};
    DB.assets.push(a);
    insertIntoText('{{img:'+a.id+'}}');
    if(DB.ui.preview) render();
    toast('已插入图片 '+res.w+'×'+res.h+' · '+Math.round(res.size/1024)+' KB');
  });
}
function richText(t){
  let s=esc(t||'');
  s=s.replace(/\{\{img:([A-Za-z0-9_-]+)\}\}/g,(m,id)=>{

    return a?'<img class="pimg" src="'+a.dataUrl+'" alt="'+esc(a.name||'')+'" data-act="openImg" data-id="'+id+'">'
      :'<span class="mini">［图片丢失：'+id+'］</span>';
  });
  s=s.replace(/\[\[([^\]]+)\]\]/g,(m,x)=>'<span class="ref" data-act="jumpTitle" data-title="'+x+'">'+x+'</span>');
  const ps=s.split(/\n{2,}/).filter(x=>x.trim()!=='');
  return ps.length?ps.map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join(''):'<p class="mini">（还没有正文）</p>';
}

function chapBlock(c,idx){
  const wc=chars(c.text);
  const qn=(DB.quests||[]).filter(q=>q.chapterId===c.id).length;
  let h='<div class="chap"><div class="ch" data-act="openNode" data-id="'+c.id+'">'
    +'<span class="no">'+String(idx||1).padStart(2,'0')+'</span>'
    +'<b>'+esc(c.title||'（未命名）')+'</b>'
    +'<span class="sum">'+esc(c.summary||'—')+'</span>'
    +(c.func?'<span class="chip">'+c.func+'</span>':'<span class="chip" style="color:var(--accent)">未标注</span>')
    +(qn?'<span class="chip">'+qn+' 任务</span>':'')
    +'<span class="bars">'+[1,2,3,4,5].map(i=>'<i class="'+(c.intensity>=i?'on':'')+'"></i>').join('')+'</span>'
    +'<span class="wc">'+(wc||'空')+(wc?' 字':'')+'</span>'
    +'</div>';
  const ss=children(c.id);
  if(ss.length){
    h+='<div class="scenes">'+ss.map((s,i)=>'<div class="sc" data-act="openNode" data-id="'+s.id+'">'
      +'<span style="width:22px;color:var(--dim2)">'+(i+1)+'</span><b>'+esc(s.title||'（未命名场景）')+'</b>'
      +(s.func?'<span class="f">'+s.func+'</span>':'')
      +'<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(s.summary||'')+'</span>'
      +'<span class="bars">'+[1,2,3,4,5].map(k=>'<i class="'+(s.intensity>=k?'on':'')+'"></i>').join('')+'</span>'
      +'</div>').join('')+'</div>';
  }
  h+='<div style="padding:0 14px 8px"><button class="btn sm ghost" data-act="addScene" data-id="'+c.id+'">＋ 场景</button></div>';
  h+='</div>';
  return h;
}
function curveSVG(cs){
  const W=1000,H=118,pad=34,by=H-26,ty=14;
  const xs=cs.map((c,i)=>cs.length===1?W/2:pad+i*((W-pad*2)/(cs.length-1)));
  const ys=cs.map(c=>by-((Math.max(1,c.intensity||1)-1)/4)*(by-ty));
  const pts=xs.map((x,i)=>x.toFixed(1)+','+ys[i].toFixed(1)).join(' ');
  let s='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  for(let g=0;g<5;g++){ const y=by-(g/4)*(by-ty); s+='<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="'+(g?'2 6':'0')+'"/>'; }
  s+='<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" opacity=".75"/>';
  xs.forEach((x,i)=>{
    const c=cs[i];
    s+='<circle cx="'+x+'" cy="'+ys[i]+'" r="4.5" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.6"/>';
    s+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--dim2)">'+(i+1)+'</text>';
  });
  s+='</svg>';
  return s;
}

/* ---------- 人物 ---------- */
function viewChars(){
  if(DB.ui.charId) return charDossier();
  if(DB.ui.charBoard) return charBoardView();
  const list=charEntries();
  let h='<div class="out"><div class="outhead"><div><h2>人物</h2><p>'+list.length+' 个角色。点头像进档案；头像可换图标、底色，或上传图片。</p></div>'
    +'<div style="display:flex;gap:8px"><button class="btn" data-act="charView" data-v="board">关系板</button><button class="btn primary" data-act="addChar">＋ 人物</button></div></div>';
  h+=list.length?'<div class="charcards">'+list.map(charCard).join('')+'</div>'
    :'<div class="empty">还没有人物<small>——<br>先建一个主角：一个欲望、一个缺陷、一个秘密</small></div>';
  return h+'</div>';
}

    +'<span class="mini">拖节点摆位置 · 线来自每个人的「关系」 · 点节点进档案</span>'

    +avatarHTML(e,58)
    +'<div class="nm">'+esc(e.title||'未命名')+'</div>'
    +'<div class="rl">'+esc(clip(role,12)||'—')+'</div>'

  const appears=nodesMentioning(e.title).filter(n=>n.type==='chapter');
  let h='<div class="out"><div class="outhead"><div><button class="btn sm ghost" data-act="closeChar">← 全部人物</button></div>'
    +'<div style="display:flex;gap:8px"><button class="btn" data-act="charMap">关系图</button>'
    +'<button class="btn sm" data-act="delChar" style="color:#a34a3f">删除</button></div></div>';
  h+='<div class="dossier"><aside class="dleft">';
  h+='<div data-act="pickAvatar" style="cursor:pointer;display:inline-block">'+avatarHTML(e,104)+'</div>';
  h+='<div class="mini" style="margin-top:8px">点头像更换</div>';
  h+='<label class="f" style="margin-top:14px"><span>姓名</span><input type="text" data-bind="entry.title" value="'+esc(e.title)+'"></label>';
  h+='<label class="f"><span>身份 / 定位</span><input type="text" data-bind="entry.fields.身份" value="'+esc(e.fields['身份']||'')+'"></label>';
  h+='<label class="f"><span>又名</span><input type="text" data-bind="entry.alias" value="'+esc((e.alias||[]).join('，'))+'"></label>';
  h+='<div style="display:flex;gap:5px;justify-content:center">'+Object.keys(ES).map(k=>'<button class="btn sm '+(e.status===k?'primary':'ghost')+'" data-act="charStatus" data-v="'+k+'">'+ES[k].label+'</button>').join('')+'</div>';
  h+='</aside><div class="dright">';
  h+='<div class="dgrid">';
  ['年龄','外形','声音','欲望','恐惧','缺陷','创伤','秘密','弧光','口癖','结局'].forEach(k=>{
    h+='<label class="f"><span>'+k+'</span><textarea data-bind="entry.fields.'+k+'" rows="2">'+esc(e.fields[k]||'')+'</textarea></label>';
  });
  h+='</div>';
  h+='<h5>关系</h5>';
  if(!rels.length) h+='<div class="hint" style="margin-bottom:8px">还没有关系。关系是一条线，不是一句形容。</div>';
  rels.forEach(r=>{
    const other=entryBy(r.a===e.id?r.b:r.a);
    h+='<div class="relrow">'+avatarHTML(other||{},22)
      +'<b data-act="openChar" data-id="'+(other?other.id:'')+'">'+esc(other?other.title:'（已删除）')+'</b>'
      +'<span style="flex:1">'+esc(r.kind||'')+'</span>'
      +'<span data-act="delRel" data-id="'+r.id+'" style="cursor:pointer;color:var(--dim2)">✕</span></div>';
  });
  const others=charEntries().filter(x=>x.id!==e.id);
  if(others.length) h+='<div style="display:flex;gap:6px;margin-top:10px">'
    +'<select id="relTo" style="width:140px">'+others.map(x=>'<option value="'+x.id+'">'+esc(x.title)+'</option>').join('')+'</select>'
    +'<input id="relKind" type="text" placeholder="关系（旧识 / 互不信任 / 单方面）" style="flex:1">'
    +'<button class="btn sm" data-act="addRel">＋</button></div>';
  h+='<h5>相关任务</h5>';
  const myQs=(DB.quests||[]).filter(Q=>Q.giverId===e.id||(Q.charIds||[]).indexOf(e.id)>=0);
  h+=myQs.length?myQs.map(Q=>'<div class="relrow"><b data-act="openQuest" data-id="'+Q.id+'">'+esc(Q.title)+'</b>'
      +'<span style="flex:1;font-size:11px">'+esc(Q.type||'')+(Q.giverId===e.id?' · 他给的':'')+'</span>'
      +'<span class="mini">'+QSTATUS[Q.status||'idea']+'</span></div>').join('')

  const apps=appearancesOf(e);

    const idx=chapters().indexOf(a.node)+1;

  if(apps.length>10) h+='<div class="mini">只显示前 10 处</div>';
  h+='</div></div></div>';
  return h;
}
function charMapSVG(){
  const cs=charEntries();
  if(!cs.length) return '<div class="empty">还没有人物</div>';
  const W=760,H=460,cx=W/2,cy=H/2,R=Math.min(W,H)/2-74;
  const pos={};
  cs.forEach((c,i)=>{ const a=-Math.PI/2+i*(2*Math.PI/Math.max(1,cs.length)); pos[c.id]={x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R}; });
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:min(62vh,540px);display:block">';
  DB.rels.forEach(r=>{
    const p=pos[r.a], q=pos[r.b]; if(!p||!q) return;
    s+='<line x1="'+p.x+'" y1="'+p.y+'" x2="'+q.x+'" y2="'+q.y+'" stroke="var(--line2)" stroke-width="1.2"/>';
    if(r.kind){
      const mx=(p.x+q.x)/2, my=(p.y+q.y)/2;
      s+='<text x="'+mx+'" y="'+(my-7)+'" text-anchor="middle" font-size="10.5" fill="var(--dim)" stroke="var(--paper)" stroke-width="3" paint-order="stroke">'+esc(clip(r.kind,9))+'</text>';
    }
  });
  cs.forEach(c=>{
    const p=pos[c.id];
    s+='<g data-act="openChar" data-id="'+c.id+'" style="cursor:pointer">'
      +'<circle cx="'+p.x+'" cy="'+p.y+'" r="27" fill="var(--panel)" stroke="var(--line2)"/>'
      +'<text x="'+p.x+'" y="'+(p.y+8)+'" text-anchor="middle" font-size="22">'+((c.avatar&&c.avatar.icon)||'👤')+'</text>'
      +'<text x="'+p.x+'" y="'+(p.y+46)+'" text-anchor="middle" font-size="12.5" fill="var(--ink)">'+esc(clip(c.title||'未命名',8))+'</text>'
      +'</g>';
  });
  return s+'</svg>';
}

/* ---------- 画布（地图 / 人物关系板 / 词条地图） ---------- */
function ensureMap(){
  if(!DB.map||typeof DB.map!=='object') DB.map={};
  if(!DB.map.places||typeof DB.map.places!=='object') DB.map.places={};
  if(!DB.map.chars||typeof DB.map.chars!=='object') DB.map.chars={};
  if(!DB.map.entries||typeof DB.map.entries!=='object') DB.map.entries={};
  if(!Array.isArray(DB.map.regions)) DB.map.regions=[];
  if(!Array.isArray(DB.map.links)) DB.map.links=[];
  if(!Array.isArray(DB.map.entryLinks)) DB.map.entryLinks=[];
  return DB.map;
}
function mapPlaces(){ return DB.entries.filter(e=>e.type==='place'); }
function posMap(kind){
  const m=ensureMap();
  return kind==='chars'?m.chars:kind==='entries'?m.entries:m.places;
}
function boardItems(kind){
  if(kind==='chars') return charEntries();
  if(kind==='entries') return DB.entries.slice();
  return mapPlaces();
}
function isOrphan(e){
  if(!chapters().some(c=>String(c.text||'').trim())) return false;
  if(nodesMentioning(e.title).length) return false;
  return !(e.alias||[]).some(a=>a&&nodesMentioning(a).length);
}
function boardHTML(kind){
  const pos=posMap(kind), list=boardItems(kind);
  list.forEach((e,i)=>{ if(!pos[e.id]) pos[e.id]={x:90+(i%5)*270,y:90+Math.floor(i/5)*160}; });
  let h='<div class="mapwrap"><div class="mapcanvas" id="mapcanvas" data-board="'+kind+'">';
  if(kind==='places'){
    ensureMap().regions.forEach(r=>{
      h+='<div class="mregion" data-rid="'+r.id+'" style="left:'+r.x+'px;top:'+r.y+'px;width:'+r.w+'px;height:'+r.h+'px">'
        +'<div class="rl" data-act="mapRenameRegion" data-id="'+r.id+'">'+esc(r.name||'区域')+'</div>'
        +'<div class="rx" data-act="mapDelRegion" data-id="'+r.id+'">✕</div>'
        +'<div class="mhandle" data-rid="'+r.id+'"></div></div>';
    });
  }
  h+='<svg class="mapedge" width="1800" height="1300">';
  const lineHTML=(x1,y1,x2,y2,cls,label)=>{
    h+='<line class="line'+(cls||'')+'" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"></line>';
    if(label) h+='<text class="elab" x="'+((x1+x2)/2)+'" y="'+((y1+y2)/2-6)+'" text-anchor="middle">'+esc(label)+'</text>';
  };
  if(kind==='places'){
    ensureMap().links.forEach(l=>{
      const a=pos[l.a], b=pos[l.b]; if(!a||!b) return;
      const x1=a.x+71,y1=a.y+24,x2=b.x+71,y2=b.y+24;
      h+='<line class="hit" data-act="mapSelLink" data-id="'+l.id+'" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"></line>';
      lineHTML(x1,y1,x2,y2,DB.ui.selLink===l.id?' sel':'',l.label);
    });
  }else if(kind==='chars'){
    (DB.rels||[]).forEach(r=>{
      const a=pos[r.a], b=pos[r.b]; if(!a||!b) return;
      lineHTML(a.x+71,a.y+24,b.x+71,b.y+24,'',r.kind);
    });
  }else if(kind==='entries'){
    (ensureMap().entryLinks||[]).forEach(l=>{
      const a=pos[l.a], b=pos[l.b]; if(!a||!b) return;
      const x1=a.x+71,y1=a.y+24,x2=b.x+71,y2=b.y+24;
      h+='<line class="hit" data-act="mapSelLink" data-id="'+l.id+'" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"></line>';
      lineHTML(x1,y1,x2,y2,DB.ui.selLink===l.id?' sel':'',l.label);
    });
  }
  h+='</svg>';
  list.forEach(e=>{
    const p=pos[e.id];
    const pick=(kind==='places'&&DB.ui.linkA===e.id)?' pick':'';
    let inner='';
    if(kind==='chars'){
      inner='<div class="mn">'+avatarHTML(e,18)+esc(e.title||'未命名')+'</div>'
        +'<div class="mt">'+esc(clip(e.fields['身份']||'',16)||'—')+'</div>';
    }else if(kind==='entries'){
      const T=ET[e.type]||{icon:'·',label:''};
      inner='<div class="mn"><i style="font-style:normal;color:var(--accent)">'+T.icon+'</i>'+esc(e.title||'未命名')+'</div>'
        +'<div class="mt">'+esc(T.label)+'</div>';
    }else{
      inner='<div class="mn">'+((e.avatar&&e.avatar.icon)||'▣')+' '+esc(e.title||'未命名')+'</div>'
        +'<div class="mt">'+esc(clip(entryExcerpt(e),18)||'地点')+'</div>';
    }
    h+='<div class="mnode'+(kind==='entries'&&isOrphan(e)?' orph':'')+pick+'" data-act="boardNode" data-kind="'+kind+'" data-id="'+e.id+'" style="left:'+p.x+'px;top:'+p.y+'px">'+inner+'</div>';
  });
  if(!list.length){
    h+='<div style="position:absolute;left:60px;top:60px;color:var(--dim2);font-family:var(--serif)">'
      +(kind==='chars'?'还没有人物。':'还没有词条。')+'</div>';
  }
  h+='</div></div>';
  return h;
}

    +'<button class="btn sm '+(DB.ui.linkMode?'primary':'')+'" data-act="mapLinkMode">'

    +'<button class="btn sm" data-act="mapAddRegion">＋ 区域</button>'
    +'<button class="btn sm" data-act="mapAddPlace">＋ 地点</button>'
    +'<button class="btn sm ghost" data-act="mapAuto" data-kind="places">整理</button>'

let MAPDRAG=null, mapDragEndAt=0;
document.addEventListener('mousedown',function(e){
  if(!DB) return;
  const cv=e.target.closest('#mapcanvas'); if(!cv) return;
  const kind=cv.dataset.board||'places';
  const hd=e.target.closest('.mhandle');
  if(hd){
    const r=ensureMap().regions.find(x=>x.id===hd.dataset.rid);
    if(r){ MAPDRAG={type:'resize',r:r,sx:e.clientX,sy:e.clientY,ow:r.w,oh:r.h}; e.preventDefault(); }
    return;
  }
  const rg=e.target.closest('.mregion');
  if(rg){
    const r=ensureMap().regions.find(x=>x.id===rg.dataset.rid);
    if(r){ MAPDRAG={type:'move',r:r,sx:e.clientX,sy:e.clientY,ox:r.x,oy:r.y}; e.preventDefault(); }
    return;
  }
  const nd=e.target.closest('.mnode');
  if(nd){
    const p=posMap(kind)[nd.dataset.id];
    if(p){ MAPDRAG={type:'node',kind:kind,id:nd.dataset.id,el:nd,sx:e.clientX,sy:e.clientY,ox:p.x,oy:p.y,moved:false}; e.preventDefault(); }
  }
});
document.addEventListener('mousemove',function(e){
  if(!MAPDRAG) return;
  const d=MAPDRAG, dx=e.clientX-d.sx, dy=e.clientY-d.sy;
  if(Math.abs(dx)+Math.abs(dy)>3) d.moved=true;
  if(d.type==='node'){
    const p=posMap(d.kind)[d.id];
    p.x=Math.max(0,d.ox+dx); p.y=Math.max(0,d.oy+dy);
    d.el.style.left=p.x+'px'; d.el.style.top=p.y+'px';
  }else if(d.type==='move'){
    d.r.x=Math.max(0,d.ox+dx); d.r.y=Math.max(0,d.oy+dy);
    const el=document.querySelector('.mregion[data-rid="'+d.r.id+'"]');
    if(el){ el.style.left=d.r.x+'px'; el.style.top=d.r.y+'px'; }
  }else if(d.type==='resize'){
    d.r.w=Math.max(140,d.ow+dx); d.r.h=Math.max(90,d.oh+dy);
    const el=document.querySelector('.mregion[data-rid="'+d.r.id+'"]');
    if(el){ el.style.width=d.r.w+'px'; el.style.height=d.r.h+'px'; }
  }
  e.preventDefault();
});
document.addEventListener('mouseup',function(){
  if(!MAPDRAG) return;
  const d=MAPDRAG; MAPDRAG=null;
  if(!d.moved) return;
  mapDragEndAt=Date.now();
  ensureMap().updatedAt=now();
  touch(); render();
});
document.addEventListener('dblclick',function(e){
  const cv=e.target.closest('#mapcanvas');
  if(!cv) return;
  const kind=cv.dataset.board||'places';
  const ln=e.target.closest('.hit');
  if(ln&&(kind==='places'||kind==='entries')){
    const arr=kind==='places'?ensureMap().links:ensureMap().entryLinks;
    const l=(arr||[]).find(x=>x.id===ln.dataset.id);
    if(l){
      const v=prompt('这条线叫什么',l.label||'');
      if(v!=null){ l.label=v.trim(); ensureMap().updatedAt=now(); touch(); render(); }
    }
    return;
  }
  if(kind!=='places') return;
  if(e.target.closest('.mnode,.mregion')) return;
  const rect=cv.getBoundingClientRect();
  const x=Math.round(e.clientX-rect.left-71), y=Math.round(e.clientY-rect.top-24);
  const name=prompt('地点名','新地点');
  if(name==null) return;
  const en=blankEntry('place'); en.title=(name.trim()||'新地点');
  DB.entries.push(en);
  ensureMap().places[en.id]={x:Math.max(0,x),y:Math.max(0,y)};
  ensureMap().updatedAt=now();
  touch(); render(); DB.ui.entryId=en.id; renderDrawer();
});

const ITEM_SRV='http://127.0.0.1:5128';
let ITEMDOC=null, ITEMOPTS=null, ITEMDIRTY=false;
function itemSrv(){ return String((DB.ui&&DB.ui.itemSrv)||ITEM_SRV).replace(/\/+$/,''); }
async function itemFetch(path,opt){
  let res;
  try{ res=await fetch(itemSrv()+path,opt||{}); }
  catch(e){ throw new Error('连不上本地编辑器（'+itemSrv()+'）——先运行 Tools/ItemEditor/start_item_editor.ps1'); }
  const txt=await res.text();
  let data=null;
  try{ data=txt?JSON.parse(txt):null; }catch(e){ data=txt; }
  if(!res.ok){
    const err=new Error((data&&(data.detail||data.title))||('HTTP '+res.status));
    err.status=res.status; err.data=data;
    throw err;
  }
  return data;
}

const TOKKEY='story-desk.gh';
const DEFAULT_REPO='MAKOPedro/STORY-D';
const DEFAULT_PROXY='https://story-desk-auth.2901000161.workers.dev';
function getToken(){ try{ return localStorage.getItem(TOKKEY)||''; }catch(e){ return ''; } }
function setToken(v){ try{ localStorage.setItem(TOKKEY,v||''); }catch(e){} }
function safeName(s){ return String(s||'项目').replace(/[\\/:*?"<>|\s]+/g,'-').slice(0,40)||'项目'; }
function syncStatusText(){
  const s=DB.sync||{};
  if(!s.lastAt) return '还没有备份过';
  return '上次备份 '+dt(s.lastAt)+(lastSave>s.lastAt?'　·　有未备份的修改':'');
}
function syncCfg(){
  if(!DB.sync) DB.sync={};
  const s=DB.sync;
  const repo=String(s.repo||'').trim()||DEFAULT_REPO;
  if(!repo||repo.indexOf('/')<0) throw new Error('先填仓库，格式 owner/repo');
  const branch=String(s.branch||'').trim()||'main';
  let dir=String(s.path||'').trim()||('backup/'+safeName(DB.meta.title)+'/');
  if(/\.json$/i.test(dir)) dir=dir.replace(/[^\/]+$/,'');
  if(!/\/$/.test(dir)) dir+='/';
  return {repo:repo,branch:branch,dir:dir};
}
function ghHeaders(scheme){
  const t=getToken();
  if(!t) throw new Error('还没有填 Token');
  return {'Authorization':(scheme||AUTH_SCHEME)+' '+t,'Accept':'application/vnd.github+json','Content-Type':'application/json'};
}
let AUTH_SCHEME='Bearer';
async function ghFetch(url,opt){
  const call=(scheme)=>fetch(url,Object.assign({headers:ghHeaders(scheme)},opt||{}));
  let res;
  try{
    res=await call(AUTH_SCHEME);
    if(res.status===401){
      const alt=(AUTH_SCHEME==='Bearer')?'token':'Bearer';
      const res2=await call(alt);
      if(res2.ok){ AUTH_SCHEME=alt; res=res2; }
      else if(res2.status!==401){ res=res2; }
    }
  }catch(err){
    throw new Error('连不上 api.github.com —— 检查网络/代理/浏览器扩展，或用 https 打开本页');
  }
  const txt=await res.text();
  let data=null;
  try{ data=txt?JSON.parse(txt):null; }catch(e){ data=txt; }
  if(!res.ok){
    let msg=(data&&data.message)||('HTTP '+res.status);
    const tk=getToken();
    if(res.status===401) msg='Token 无效（401）· 已存 '+(tk?tk.length:0)+' 字符 · 末四位 '+(tk?tk.slice(-4):'（空）');
    else if(res.status===403) msg='Token 权限不够（403）—— 需要 Contents: Read and write';
    else if(res.status===404) msg='仓库不存在，或这个 Token 看不到它（404）';
    else msg=msg+'（HTTP '+res.status+'）';
    const err=new Error(msg);
    err.status=res.status;
    throw err;
  }
  return data;
}
async function ghGetJson(cfg,path){
  const p=path.split('/').map(encodeURIComponent).join('/');
  const d=await ghFetch('https://api.github.com/repos/'+cfg.repo+'/contents/'+p+'?ref='+encodeURIComponent(cfg.branch));
  return JSON.parse(b64dec(d.content));
}
function b64enc(str){
  const bytes=new TextEncoder().encode(str);
  let bin='';
  for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64dec(b64){
  const bin=atob(String(b64||'').replace(/\s/g,''));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function mergeById(local,remote){
  const m={};
  local.forEach(x=>{ if(x&&x.id) m[x.id]=x; });
  (remote||[]).forEach(r=>{
    if(!r||!r.id) return;
    const l=m[r.id];
    if(!l){ local.push(r); return; }
    if((r.updatedAt||0)>(l.updatedAt||0)) Object.assign(l,r);
  });
}
function unionById(local,remote){
  const m={}, out=(local||[]).slice();
  out.forEach(x=>{ if(x&&x.id) m[x.id]=x; });
  (remote||[]).forEach(r=>{
    if(!r||!r.id) return;
    if(!m[r.id]){ out.push(r); m[r.id]=r; }
    else Object.assign(m[r.id],r);
  });
  return out;
}

async function ghPush(force){
  const cfg=syncCfg();
  const lastAt=(DB.sync&&DB.sync.lastAt)||0;
  const cs=chapters();
  const metaObj={
    v:2,updatedAt:now(),dir:cfg.dir,
    meta:DB.meta,entries:DB.entries,rels:DB.rels||[],events:DB.events||[],threads:DB.threads||[],
    dialogues:DB.dialogues||[],quests:DB.quests||[],map:DB.map||{},assets:DB.assets||[],
    nodes:DB.nodes.filter(n=>n.type!=='chapter'),
    chapters:cs.map(c=>({id:c.id,title:c.title,order:c.order,updatedAt:c.updatedAt||0}))
  };
  const files=[
    {path:cfg.dir+'meta.json',content:JSON.stringify(metaObj,null,2)},
    {path:cfg.dir+'全文.md',content:toMarkdown()}
  ];
  const all=!lastAt||DB.sync.lastDir!==cfg.dir;
  cs.forEach(c=>{
    if(all||(c.updatedAt||0)>lastAt)
      files.push({path:cfg.dir+'chapters/'+c.id+'.json',content:JSON.stringify(c,null,2)});
  });
  const msg='备份 '+new Date().toLocaleString('zh-CN')+' · '+totalWords()+' 字 · '+cs.length+' 章';
  const base='https://api.github.com/repos/'+cfg.repo+'/git';
  let head=null;
  try{ head=await ghFetch(base+'/ref/heads/'+cfg.branch); }
  catch(e){ if(e.status!==404) throw e; }
  let parent=null, baseTree=null;
  if(head&&head.object&&head.object.sha){
    parent=head.object.sha;
    const cm=await ghFetch(base+'/commits/'+parent);
    baseTree=cm.tree.sha;
  }
  const entries=[];
  for(let i=0;i<files.length;i++){
    const b=await ghFetch(base+'/blobs',{method:'POST',body:JSON.stringify({content:files[i].content,encoding:'utf-8'})});
    entries.push({path:files[i].path,mode:'100644',type:'blob',sha:b.sha});
  }
  const tb={tree:entries};
  if(baseTree) tb.base_tree=baseTree;
  const tree=await ghFetch(base+'/trees',{method:'POST',body:JSON.stringify(tb)});
  const cb={message:msg,tree:tree.sha};
  if(parent) cb.parents=[parent];
  const commit=await ghFetch(base+'/commits',{method:'POST',body:JSON.stringify(cb)});
  if(parent){
    await ghFetch(base+'/refs/heads/'+cfg.branch,{method:'PATCH',body:JSON.stringify({sha:commit.sha,force:!!force})});
  }else{
    await ghFetch(base+'/refs',{method:'POST',body:JSON.stringify({ref:'refs/heads/'+cfg.branch,sha:commit.sha})});
  }
  DB.sync.lastAt=now();
  DB.sync.lastDir=cfg.dir;
  DB.sync.lastCommit=commit.sha;
  DB.sync.lastMsg=msg;
  persist(); render();
  toast('已备份 '+cs.length+' 章到 '+cfg.repo);
}
async function ghPull(){
  const cfg=syncCfg();
  const metaObj=await ghGetJson(cfg,cfg.dir+'meta.json');
  if(!metaObj||!Array.isArray(metaObj.chapters)) throw new Error('远端还没有 meta.json，先上传一次');
  snapshot('拉取前');
  const local={};
  chapters().forEach(c=>{ local[c.id]=c; });
  let add=0,upd=0,kept=0;
  for(const rc of metaObj.chapters){
    const lc=local[rc.id];
    if(lc&&(lc.updatedAt||0)>=(rc.updatedAt||0)){ kept++; continue; }
    let full=null;
    try{ full=await ghGetJson(cfg,cfg.dir+'chapters/'+rc.id+'.json'); }
    catch(e){ if(e.status!==404) throw e; }
    if(!full) continue;
    const node=fixNode(full);
    if(lc){ Object.assign(lc,node); upd++; }
    else { DB.nodes.push(node); add++; }
  }
  mergeById(DB.entries,metaObj.entries);
  mergeById(DB.nodes,metaObj.nodes||[]);
  DB.rels=unionById(DB.rels||[],metaObj.rels||[]);
  DB.events=unionById(DB.events||[],metaObj.events||[]);
  DB.threads=unionById(DB.threads||[],metaObj.threads||[]);
  DB.dialogues=unionById(DB.dialogues||[],metaObj.dialogues||[]);
  DB.quests=unionById(DB.quests||[],metaObj.quests||[]);
  DB.assets=unionById(DB.assets||[],metaObj.assets||[]);
  if(metaObj.map&&(metaObj.map.updatedAt||0)>(ensureMap().updatedAt||0)) DB.map=metaObj.map;
  if(metaObj.meta&&(metaObj.updatedAt||0)>((DB.meta&&DB.meta.updatedAt)||0)){
    DB.meta=Object.assign({},DB.meta,metaObj.meta);
  }
  DB.entries=DB.entries.map(fixEntry).filter(Boolean);
  DB.nodes=DB.nodes.map(fixNode).filter(Boolean);
  DB.sync.lastAt=now();
  DB.sync.lastDir=cfg.dir;
  if(!DB.ui.nodeId||!nodeBy(DB.ui.nodeId)) DB.ui.nodeId=(chapters()[0]||{}).id||null;
  persist(); render();
  toast('拉取完成：更新 '+upd+' 章 · 新增 '+add+' 章 · 本地更新保留 '+kept+' 章');
}

/* ---------- 本地文件夹自动备份 ---------- */
let BK={handle:null,name:'',busy:false,last:0};
function bkSupported(){ return typeof window!=='undefined'&&!!window.showDirectoryPicker; }
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('storydesk',1);
    r.onupgradeneeded=()=>{ try{ r.result.createObjectStore('kv'); }catch(e){} };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
function idbSet(k,v){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const t=db.transaction('kv','readwrite');
    t.objectStore('kv').put(v,k);
    t.oncomplete=()=>res(true); t.onerror=()=>rej(t.error);
  }));
}
function idbGet(k){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const t=db.transaction('kv','readonly');
    const q=t.objectStore('kv').get(k);
    q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
  }));
}
function bkStamp(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
}
async function bkLoad(){
  if(!bkSupported()) return;
  if(typeof indexedDB==='undefined') return;
  try{
    const h=await idbGet('backupDir');
    if(h){ BK.handle=h; BK.name=h.name; try{ const q=await h.queryPermission({mode:'readwrite'}); BK.granted=(q==='granted'); }catch(e){} }
  }catch(e){}
}
async function bkPickDir(){
  if(!bkSupported()) return warn('这个浏览器不支持文件夹备份，请用 Chrome / Edge 打开');
  try{
    const h=await window.showDirectoryPicker({mode:'readwrite'});
    BK.handle=h; BK.name=h.name; BK.granted=true;
    try{ idbSet('backupDir',h).catch(()=>{}); }catch(e){}
    await bkWrite(true);
    toast('已连接备份文件夹「'+h.name+'」');
  }catch(e){
    if(e&&e.name!=='AbortError') warn('选文件夹失败：'+(e.message||e));
  }
  paintBk();
}
async function bkRequestPerm(){
  if(!BK.handle) return bkPickDir();
  try{
    const p=await BK.handle.requestPermission({mode:'readwrite'});
    BK.granted=(p==='granted');
    if(BK.granted){ await bkWrite(true); }
    else warn('没有拿到写入权限');
  }catch(e){ warn('授权失败：'+(e.message||e)); }
  paintBk();
}
async function bkWrite(force){
  if(!BK.handle||BK.busy) return false;
  BK.busy=true;
  try{
    if(!BK.granted){
      try{ BK.granted=(await BK.handle.queryPermission({mode:'readwrite'}))==='granted'; }catch(e){ BK.granted=false; }
      if(!BK.granted){ if(force) warn('备份文件夹需要重新授权'); return false; }
    }
    const data=JSON.stringify(DB);
    const name='创作台-'+bkStamp()+'.json';
    const fh=await BK.handle.getFileHandle(name,{create:true});
    const w=await fh.createWritable();
    await w.write(data); await w.close();
    try{
      const lh=await BK.handle.getFileHandle('最新.json',{create:true});
      const lw=await lh.createWritable();
      await lw.write(data); await lw.close();
    }catch(e){}
    await bkPrune();
    DB.sync=DB.sync||{}; DB.sync.lastBackup=now();
    BK.last=Date.now();
    touch();
    if(force) toast('已备份到「'+BK.name+'」');
    return true;
  }catch(e){
    warn('备份失败：'+(e.message||e));
    return false;
  }finally{
    BK.busy=false;
    paintBk();
  }
}
async function bkPrune(keep){
  if(!BK.handle||!BK.handle.entries) return;
  const list=[];
  try{
    for await (const pair of BK.handle.entries()){
      const n=pair[0]||'';
      if(n.indexOf('创作台-')===0&&n.slice(-5)==='.json') list.push(n);
    }
  }catch(e){ return; }
  list.sort();
  const max=keep||30;
  while(list.length>max){
    const old=list.shift();
    try{ await BK.handle.removeEntry(old); }catch(e){}
  }
}
function bkMaybe(){
  if(!BK.handle||!BK.granted) return;
  if(Date.now()-BK.last<10*60*1000) return;
  bkWrite(false);
}
function paintBk(){
  const el=document.getElementById('bkStatus');
  if(!el) return;
  if(!bkSupported()){ el.textContent='这个浏览器不支持文件夹备份（用 Chrome / Edge）'; return; }
  if(!BK.handle){ el.textContent='还没选备份文件夹'; return; }

  el.textContent=BK.granted?('备份到「'+BK.name+'」· 上次 '+t):('「'+BK.name+'」需要重新授权');
}

function frCount(v,q,cs){
  if(!q) return 0;
  const hay=cs?v:String(v).toLowerCase(), needle=cs?q:q.toLowerCase();
  let i=hay.indexOf(needle), n=0;
  while(i>=0){ n++; i=hay.indexOf(needle,i+needle.length); }
  return n;
}
function frSnip(v,q,cs){
  if(!q) return '';
  const hay=cs?v:String(v).toLowerCase(), needle=cs?q:q.toLowerCase();
  let i=hay.indexOf(needle);
  if(i<0) return '';
  const a=Math.max(0,i-24), b=Math.min(v.length,i+q.length+34);
  return (a>0?'…':'')+v.slice(a,b)+(b<v.length?'…':'');
}
function frScan(q,cs){
  if(!q) return [];
  return frTargets().map(t=>{
    const v=String(t.get()||'');
    const c=frCount(v,q,cs);
    return c?{label:t.label,count:c,snippet:frSnip(v,q,cs)}:null;
  }).filter(Boolean);
}
function frRun(q,to,cs){
  if(!q) return 0;
  let total=0;
  frTargets().forEach(t=>{
    const v=String(t.get()||'');
    const c=frCount(v,q,cs);
    if(!c) return;
    let nv;
    if(cs) nv=v.split(q).join(to);
    else nv=v.replace(new RegExp(escRe(q),'gi'),to);
    t.set(nv); total+=c;
  });
  return total;
}
function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function frPaint(){
  const q=((document.getElementById('frQ')||{}).value)||'';
  const csEl=document.getElementById('frCs');
  const cs=csEl?!!csEl.checked:true;
  const out=document.getElementById('frOut'); if(!out) return;
  if(!q){ out.innerHTML='<div class="mini">输入要查找的文字</div>'; return; }
  const hits=frScan(q,cs);
  const total=hits.reduce((s,h)=>s+h.count,0);
  out.innerHTML='<div class="mini" style="margin-bottom:8px">命中 <b>'+total+'</b> 处 · 涉及 '+hits.length+' 个位置</div>'
    +(hits.length?hits.map(h=>'<div style="display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-bottom:1px solid var(--line)">'
      +'<span style="flex:none;color:var(--dim2);font-size:11px;min-width:150px">'+esc(h.label)+'</span>'
      +'<span style="flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(h.snippet||'')+'</span>'
      +'<span class="mini" style="flex:none">×'+h.count+'</span></div>').join('')
      :'<div class="mini">没有找到</div>');
}
function frApply(){
  const q=((document.getElementById('frQ')||{}).value)||'';
  const to=((document.getElementById('frTo')||{}).value)||'';
  const csEl=document.getElementById('frCs');
  const cs=csEl?!!csEl.checked:true;
  if(!q) return toast('先填查找内容');
  const hits=frScan(q,cs);
  const total=hits.reduce((s,h)=>s+h.count,0);
  if(!total) return toast('没有找到');
  if(!confirm('把 '+total+' 处「'+q+'」替换成「'+(to||'（空）')+'」？\n替换前会自动存一版。')) return;
  makeVersion();
  const n=frRun(q,to,cs);
  touch(); render();
  toast('已替换 '+n+' 处');
}
