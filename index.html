/* ---------- 绑定 ---------- */
function bindRoot(scope){
  if(scope==='meta') return DB.meta;
  if(scope==='entry') return curEntry();
  if(scope==='node') return curNode();
  if(scope==='ui') return DB.ui;
  if(scope==='sync') return DB.sync||(DB.sync={});
  if(scope==='dlg') return curDlg();
  if(scope==='quest') return curQuest();
  return null;
}
function setDeep(o,path,v){
  let c=o;
  for(let i=0;i<path.length-1;i++){
    const k=path[i];
    if(c[k]==null) c[k]=/^\d+$/.test(String(path[i+1]))?[]:{};
    c=c[k];
  }
  c[path[path.length-1]]=v;
}
let ctxTimer=null;
function applyBind(el){
  const parts=el.dataset.bind.split('.');
  const root=bindRoot(parts[0]); if(!root) return;
  const path=parts.slice(1);
  let v=el.value;
  if(path[path.length-1]==='alias') v=v.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  setDeep(root,path,v);
  if(parts[0]==='entry'){ root.updatedAt=now(); if(root.demo) root.demo=false; }
  if(parts[0]==='node'){ root.updatedAt=now(); if(root.demo) root.demo=false; }
  if(parts[0]==='dlg'||parts[0]==='quest') root.updatedAt=now();
  if(parts[0]==='meta'){
    root.updatedAt=now();
    if(path[0]==='title') $('#ptitle').textContent=DB.meta.title||'未命名';
  }
  if(parts[0]==='node'&&path[0]==='title'){ const row=$('.trow.on .tw'); if(row) row.textContent=root.title||'（未命名）'; }
  touch();
  if(parts[0]==='node'&&path[0]==='text'){
    const wc=$('#wc'); if(wc) wc.textContent=chars(root.text)+' 字';
    autoGrow(el);
    if(ctxTimer) clearTimeout(ctxTimer);
    ctxTimer=setTimeout(()=>{ const c=$('#view .ctx'); if(c) c.innerHTML=ctxHTML(resultNode()); },900);
  }
  if(parts[0]==='ui'&&path[0]==='q'){
    const pos=el.selectionStart;
    setTimeout(()=>{ render(); const n=$('input[data-bind="ui.q"]'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} } },220);
  }
}
function resultNode(){ return curNode(); }

/* ---------- 动作 ---------- */
function newNode(type,parentId,title){
  const n=blankNode(type,parentId);
  if(title!=null) n.title=title;
  const sib=children(parentId);
  n.order=sib.length?Math.max.apply(null,sib.map(x=>x.order||0))+1:1;
  DB.nodes.push(n);
  return n;
}
const MAX_DEPTH=3;
function depthOf(n){
  let d=1,c=n,guard=0;
  while(c&&c.parentId&&guard++<60){ c=nodeBy(c.parentId); if(!c) break; d++; }
  return d;
}
function isDescendant(id,ancestorId){
  let c=nodeBy(id),guard=0;
  while(c&&c.parentId&&guard++<60){ if(c.parentId===ancestorId) return true; c=nodeBy(c.parentId); }
  return false;
}
function subtreeIds(id,out){
  out=out||[]; out.push(id);
  children(id).forEach(k=>subtreeIds(k.id,out));
  return out;
}
function subtreeWords(id){
  return subtreeIds(id).reduce((s,i)=>{ const n=nodeBy(i); return s+chars(n&&n.text); },0);
}
function reparent(id,newParentId,index){
  const n=nodeBy(id); if(!n) return false;
  if(newParentId===id) return false;
  if(newParentId&&isDescendant(newParentId,id)) return false;
  if(newParentId){ const p=nodeBy(newParentId); if(!p) return false; if(depthOf(p)>=MAX_DEPTH) return false; }
  const oldParent=n.parentId||null;
  if(oldParent===newParentId&&index==null) return false;
  n.parentId=newParentId||null;
  const olds=children(oldParent).filter(x=>x.id!==id);
  olds.forEach((x,i)=>{ x.order=i+1; });
  const list=children(newParentId).filter(x=>x.id!==id);
  const at=(index==null||index<0||index>list.length)?list.length:index;
  list.splice(at,0,n);
  list.forEach((x,i)=>{ x.order=i+1; });
  return true;
}
function addNodeSmart(type){
  const sel=nodeBy(DB.ui.nodeId);
  const label=(type==='part')?'幕':(type==='chapter'?'章':(formMode()==='novel'?'节':'场'));
  let parent=null,index=null;
  if(sel){
    if(type==='scene'){
      if(depthOf(sel)<MAX_DEPTH){ parent=sel.id; }
      else{
        parent=sel.parentId||null;
        index=children(parent).findIndex(x=>x.id===sel.id)+1;
        toast('第三层不能再往下，已建成同级');
      }
    }else if(sel.type===type){
      parent=sel.parentId||null;
      index=children(parent).findIndex(x=>x.id===sel.id)+1;
    }else if(sel.type==='part'&&type==='chapter'){
      parent=sel.id;
    }else if(sel.type==='chapter'&&type==='part'){
      parent=null; index=children(null).findIndex(x=>x.id===sel.id)+1;
    }else{
      parent=(sel.type==='part'&&type!=='part')?sel.id:(sel.parentId||null);
    }
  }
  const kids=children(parent).length+1;
  const title=(type==='part')?(['第一幕','第二幕','第三幕','第四幕'][roots().filter(r=>r.type==='part').length]||'新的一幕')
    :(type==='chapter')?('第'+(chapters().length+1)+'章')
    :(label+' '+kids);
  const n=newNode(type,parent,title);
  if(index!=null) reparent(n.id,parent,index);
  DB.ui.nodeId=n.id; DB.ui.tab='write'; touch(); render();
  setTimeout(()=>{ const t=$('.sheet input.title'); if(t){ t.focus(); t.select(); } },50);
  return n;
}
function deleteNode(id){
  const kids=children(id);
  kids.forEach(k=>deleteNode(k.id));
  DB.nodes=DB.nodes.filter(n=>n.id!==id);
}
function openNodeById(id){
  const n=nodeBy(id); if(!n) return;
  DB.ui.nodeId=id;
  DB.ui.entryId=null;
  if(n.type!=='chapter'&&n.type!=='part'){
    const p=treePath(n).find(x=>x.type==='chapter');
    DB.ui.nodeId=p?p.id:n.id;
  }
  DB.ui.tab='write';
  render();
  setTimeout(()=>{
    const t=document.getElementById('eText');
    if(!t) return;
    t.focus();
    if(typeof t.setSelectionRange==='function'){
      try{ t.setSelectionRange(0,0); }catch(e){}
    }else if(t.isContentEditable){
      try{
        const r=document.createRange(), s=window.getSelection();
        r.selectNodeContents(t); r.collapse(true);
        s.removeAllRanges(); s.addRange(r);
      }catch(e){}
    }
  },40);
}
function openEntryById(id){
  if(!entryBy(id)) return;
  DB.ui.entryId=id; renderDrawer();
}

function copyText(t){
  const fb=()=>{ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    ta.remove(); toast(ok?'已复制':'复制失败，请手动选择'); };
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(()=>toast('已复制'),fb);
  else fb();
}
const ACT={
  tab(el){ DB.ui.tab=el.dataset.tab; DB.ui.entryId=null; DB.ui.linkMode=false; DB.ui.linkA=null; render(); },
  rename(){
    const v=prompt('项目名称',DB.meta.title||'');
    if(v!=null){ DB.meta.title=v.trim()||'未命名'; touch(); render(); }
  },
  theme(){
    DB.ui.theme=DB.ui.theme==='night'?'paper':'night';
    document.documentElement.dataset.theme=DB.ui.theme;
    $('.themebtn').textContent=DB.ui.theme==='night'?'纸':'夜';
    touch();
  },
  addPart(){ addNodeSmart('part'); },
  addChapter(){ addNodeSmart('chapter'); },
  setForm(el){
    DB.meta.form=el.dataset.v||'novel';
    touch(); render();
    toast(formMode()==='novel'?'已切到小说：章 → 节':(formMode()==='script'?'已切到剧本：幕 → 场':'混合模式：幕、章、场都可建'));

let palIdx=0, palItems=[];
function paletteData(){
  const items=[];
  DB.nodes.forEach(n=>items.push({kind:'node',id:n.id,label:n.title||'（未命名）',meta:typeLabel(n)}));
  DB.entries.forEach(e=>items.push({kind:'entry',id:e.id,label:e.title||'（未命名）',meta:ET[e.type].label}));
  return items;
}
function openPalette(){
  $('#palette').classList.add('on');
  const q=$('#pq'); q.value=''; palIdx=0;
  renderPalette('');
  setTimeout(()=>q.focus(),20);
}
function closePalette(){ $('#palette').classList.remove('on'); }
function renderPalette(q){
  const s=String(q||'').toLowerCase();
  palItems=paletteData().filter(x=>!s||x.label.toLowerCase().indexOf(s)>=0||(x.meta||'').toLowerCase().indexOf(s)>=0).slice(0,40);
  if(palIdx>=palItems.length) palIdx=0;
  $('#pres').innerHTML=palItems.length?palItems.map((x,i)=>
    '<div class="pitem'+(i===palIdx?' on':'')+'" data-act="pitem" data-kind="'+x.kind+'" data-id="'+x.id+'" data-i="'+i+'">'
    +'<span class="k">'+esc(x.meta)+'</span><b>'+esc(x.label)+'</b>'
    +'<span>'+x.kind+'</span></div>').join('')
    :'<div class="pitem">没有匹配</div>';
}
function palKey(e){
  if(e.key==='Escape'){ closePalette(); return; }
  if(e.key==='ArrowDown'){ e.preventDefault(); palIdx=Math.min(palItems.length-1,palIdx+1); renderPalette($('#pq').value); }
  if(e.key==='ArrowUp'){ e.preventDefault(); palIdx=Math.max(0,palIdx-1); renderPalette($('#pq').value); }
  if(e.key==='Enter'){
    e.preventDefault();
    const it=palItems[palIdx];
    if(it){ closePalette(); if(it.kind==='node') openNodeById(it.id); else { DB.ui.tab='lib'; openEntryById(it.id); render(); } }
  }
}

function download(name,text,mime){
  const blob=new Blob([text],{type:(mime||'text/plain')+';charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1200);
}

let COMPOSING=false, CTXRANGE=null, CTXTEXT='';
function richEditOn(){ return DB.ui.richEdit!==false; }
function ceEl(){ return document.getElementById('eText'); }
function ceChip(name){ return '<span class="ce-ref" contenteditable="false" data-ref="'+esc(name)+'">'+esc(name)+'</span>'; }
function ceImg(id){
  const a=assetById(id);
  return a?'<img class="ce-img" contenteditable="false" data-img="'+id+'" src="'+a.dataUrl+'" alt="'+esc(a.name||'')+'">':'';
}
function textToCE(t){
  let s=esc(t||'');
  s=s.replace(/\{\{img:([A-Za-z0-9_-]+)\}\}/g,(m,id)=>ceImg(id));
  s=s.replace(/\[\[([^\]]+)\]\](?!\])/g,(m,x)=>ceChip(x));
  return s.replace(/\n/g,'<br>');
}
function ceToText(root){
  let out='';
  const walk=(node)=>{
    for(let i=0;i<node.childNodes.length;i++){
      const n=node.childNodes[i];
      if(n.nodeType===3){ out+=String(n.nodeValue||'').replace(/\u200b/g,''); continue; }
      if(n.nodeType!==1) continue;
      const ds=n.dataset||{};
      if(ds.ref!=null){ out+='[['+ds.ref+']]'; continue; }
      if(ds.img){ out+='{{img:'+ds.img+'}}'; continue; }
      const tag=n.tagName;
      if(tag==='BR'){ out+='\n'; continue; }
      if(tag==='DIV'||tag==='P'){ if(out&&out.slice(-1)!=='\n') out+='\n'; walk(n); continue; }
      walk(n);
    }
  };
  walk(root);
  return out.replace(/\u00a0/g,' ').replace(/\n{3,}/g,'\n\n').replace(/[ \t]+$/gm,'');
}
function syncCE(){
  const el=ceEl(); if(!el) return;
  const n=curNode(); if(!n) return;
  const t=ceToText(el);
  if(t===n.text) return;
  n.text=t; n.updatedAt=now(); touch();
  const wc=document.getElementById('wc'); if(wc) wc.textContent=chars(t)+' 字';
}

function toMarkdown(){
  const L=[];
  L.push('# '+DB.meta.title);
  if(DB.meta.logline) L.push('','> '+DB.meta.logline);
  L.push('','类型：'+(DB.meta.genre||'—')+'　目标：'+(DB.meta.targetWords||0)+' 字　当前：'+totalWords()+' 字','');
  L.push('## 一、大纲','');
  roots().forEach(r=>{
    if(r.type==='part'){
      L.push('### '+r.title,'');
      if(r.summary) L.push(r.summary,'');
      children(r.id).forEach(c=>{
        L.push('- **'+c.title+'**'+(c.func?'　['+c.func+']':'')+'　'+c.summary);
        children(c.id).forEach(s=>L.push('    - '+s.title+(s.func?'　['+s.func+']':'')+'　'+(s.summary||'')));
      });
      L.push('');
    }else{
      L.push('- **'+r.title+'**'+(r.func?'　['+r.func+']':'')+'　'+(r.summary||''));
    }
  });
  L.push('','## 二、设定','');
  EK.forEach(k=>{
    const list=DB.entries.filter(e=>e.type===k);
    if(!list.length) return;
    L.push('### '+ET[k].label,'');
    list.forEach(e=>{
      L.push('#### '+e.title+(e.status==='canon'?'　（正典）':''));
      if((e.alias||[]).length) L.push('又名：'+e.alias.join('、'));
      (ET[k].fields||[]).forEach(f=>{ const v=e.fields[f[0]]; if(v&&String(v).trim()) L.push('- **'+f[0]+'**：'+String(v).replace(/\n/g,'\n  ')); });
      if(e.body) L.push('',e.body);
      L.push('');
    });
  });
  L.push('','## 三、正文','');
  chapters().forEach(c=>{
    L.push('### '+c.title,'');
    L.push(mdText(c.text)||'（未写）','');
  });
  if((DB.dialogues||[]).length){
    L.push('','## 四、对话','');
    DB.dialogues.forEach(d=>{
      const npc=entryBy(d.npcId);
      L.push('### '+(d.title||'未命名')+(npc?'　—　'+npc.title:''));
      if(d.scene) L.push('场景：'+d.scene);
      if(d.trigger) L.push('触发：'+d.trigger);
      L.push('');
      (d.lines||[]).forEach(l=>L.push((l.sp||'？')+(l.tone?'（'+l.tone+'）':'')+'：'+(l.tx||'')));
      if(d.note) L.push('','> '+d.note);
      L.push('');
    });
  }
  if((DB.quests||[]).length){
    L.push('','## 五、任务','');
    DB.quests.forEach(q=>{
      const g=entryBy(q.giverId);
      L.push('### '+q.title+'　['+(q.type||'支线')+' · '+QSTATUS[q.status||'idea']+']');
      if(g) L.push('给予者：'+g.title);
      if(q.goal) L.push('目标：'+q.goal);
      (q.steps||[]).forEach((s,i)=>L.push((i+1)+'. '+(s.text||'')));
      if(q.reward) L.push('奖励：'+q.reward);
      if(q.fail) L.push('失败：'+q.fail);
      if(q.note) L.push('','> '+q.note);
      L.push('');
    });
  }
  return L.join('\n');
}
function toTxt(){
  return chapters().map(c=>c.title+'\n\n'+String(c.text||'').replace(/\[\[|\]\]/g,'')).join('\n\n\n');
}

/* ---------- 事件 ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){
    if($('#palette').classList.contains('on')&&!e.target.closest('.pbox')) closePalette();
    return;
  }
  if(el.tagName==='SELECT') return;
  e.preventDefault();

});
/* ---------- 树上拖拽 ---------- */
let DRAGID=null;
function clearDropCues(){
  document.querySelectorAll('.trow.over-in,.trow.over-before,.trow.over-after').forEach(x=>{
    x.classList.remove('over-in','over-before','over-after');
    try{ delete x.dataset.dropmode; }catch(e){}
  });
}
function applyDrop(dragId,targetId,mode){
  const t=nodeBy(targetId); if(!t) return;
  if(mode==='into'){
    if(depthOf(t)>=MAX_DEPTH) return toast('第三层不能再放子节点');
    if(reparent(dragId,t.id,null)){ touch(); render(); toast('已移入「'+(t.title||'未命名')+'」'); }
  }else{
    const p=t.parentId||null;
    const list=children(p).filter(x=>x.id!==dragId);
    const i=list.findIndex(x=>x.id===t.id);
    const at=(mode==='before')?i:(i+1);
    if(reparent(dragId,p,at)){ touch(); render(); }
  }
}
document.addEventListener('dragstart',e=>{
  const row=e.target&&e.target.closest?e.target.closest('.trow'):null;
  if(!row) return;
  DRAGID=row.dataset.id;
  row.classList.add('dragging');
  try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(DRAGID)); }catch(err){}
});
document.addEventListener('dragend',()=>{
  DRAGID=null; clearDropCues();
  document.querySelectorAll('.trow.dragging').forEach(x=>x.classList.remove('dragging'));
});
document.addEventListener('dragover',e=>{
  if(!DRAGID) return;
  const row=e.target&&e.target.closest?e.target.closest('.trow'):null;
  clearDropCues();
  if(!row) return;
  const id=row.dataset.id;
  if(id===DRAGID||isDescendant(id,DRAGID)) return;
  e.preventDefault();
  const r=row.getBoundingClientRect();
  const y=(e.clientY-r.top)/Math.max(1,r.height);
  const n=nodeBy(id);
  let mode=(y<0.3?'before':(y>0.7?'after':'into'));
  if(mode==='into'&&n&&depthOf(n)>=MAX_DEPTH) mode='after';
  row.classList.add('over-'+mode);
  row.dataset.dropmode=mode;
});
document.addEventListener('drop',e=>{
  const row=e.target&&e.target.closest?e.target.closest('.trow'):null;
  if(!DRAGID||!row) return;
  e.preventDefault();
  const id=row.dataset.id;
  const mode=(row.dataset&&row.dataset.dropmode)||'into';
  applyDrop(DRAGID,id,mode);
  DRAGID=null; clearDropCues();
});

/* ---------- 正文右键菜单 ---------- */
let CTXOPEN=false, CTXSEL={s:0,e:0};
function closeCtx(){
  const m=document.getElementById('ctxmenu');
  if(m) m.style.display='none';
  CTXOPEN=false;
}
function openCtx(x,y,items,sel){
  CTXSEL=sel||{s:0,e:0};
  let m=document.getElementById('ctxmenu');
  if(!m){ m=document.createElement('div'); m.id='ctxmenu'; m.className='ctxmenu'; document.body.appendChild(m); }
  m.innerHTML=items.map(it=>{
    if(it.sep) return '<div class="sep"></div>';
    if(it.head!=null) return '<div class="mini">'+esc(it.head)+'</div>';
    return '<button data-act="'+it.act+'"><span class="ic">'+(it.icon||'')+'</span>'+esc(it.label)+'</button>';
  }).join('');
  m.style.display='block';
  const r=m.getBoundingClientRect();
  m.style.left=Math.max(8,Math.min(x,window.innerWidth-r.width-8))+'px';
  m.style.top=Math.max(8,Math.min(y,window.innerHeight-r.height-8))+'px';
  CTXOPEN=true;
}
document.addEventListener('contextmenu',e=>{
  const ta=e.target;
  if(!ta||ta.id!=='eText') return;
  e.preventDefault();
  const s=ta.selectionStart||0, en=ta.selectionEnd||0;
  const sel=String(ta.value||'').slice(s,en);
  const items=[];
  if(sel.trim()){
    items.push({head:'选中 '+sel.length+' 字'});
    items.push({act:'ctxWrapRef',icon:'□',label:'变成引用 [[ ]]'});
    items.push({act:'ctxNewEntry',icon:'＋',label:'用这段文字新建词条'});
    items.push({sep:true});
  }
  items.push({act:'ctxInsertRef',icon:'□',label:'插入引用…'});
  items.push({act:'ctxPickImg',icon:'▣',label:'插入图片…'});
  items.push({sep:true});
  items.push({act:'ctxCopy',icon:'⧉',label:'复制'});
  items.push({act:'ctxCut',icon:'✂',label:'剪切'});
  items.push({act:'ctxPaste',icon:'⎘',label:'粘贴'});
  items.push({sep:true});
  items.push({act:'ctxAll',icon:'▭',label:'全选'});
  openCtx(e.clientX,e.clientY,items,{s:s,e:en});
});
document.addEventListener('click',e=>{
  if(!CTXOPEN) return;
  const t=e.target;
  if(!(t&&t.closest&&t.closest('#ctxmenu'))) closeCtx();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&CTXOPEN) closeCtx();
});

document.addEventListener('paste',e=>{
  const ta=e.target;
  if(!ta||ta.id!=='eText') return;
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  for(let i=0;i<items.length;i++){
    if(String(items[i].type||'').indexOf('image/')===0){
      const f=items[i].getAsFile&&items[i].getAsFile();
      if(f){ e.preventDefault(); addImageFile(f); }
      return;
    }
  }
  if(ta.isContentEditable){
    const txt=(e.clipboardData&&e.clipboardData.getData('text/plain'))||'';
    e.preventDefault();
    if(txt) document.execCommand('insertText',false,txt);
    syncCE();
  }
});
document.addEventListener('compositionstart',e=>{ if(e.target&&e.target.id==='eText') COMPOSING=true; });
document.addEventListener('compositionend',e=>{ if(e.target&&e.target.id==='eText'){ COMPOSING=false; syncCE(); } });
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(!t||t.id!=='eText'||!t.isContentEditable) return;
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!COMPOSING){
    e.preventDefault();
    document.execCommand('insertHTML',false,'<br>');
    syncCE();
  }
});
document.addEventListener('dragover',e=>{
  if(e.target&&e.target.id==='eText') e.preventDefault();
});
document.addEventListener('drop',e=>{
  const ta=e.target;
  if(ta&&ta.id==='eText'&&e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){
    e.preventDefault();
    addImageFile(e.dataTransfer.files[0]);
  }
});

document.addEventListener('input',e=>{
  const tg=e.target;
  if(tg.id==='eText'&&tg.isContentEditable){ if(!COMPOSING) syncCE(); return; }
  if(tg.id==='refQ'){ REFQ=tg.value; paintRef(); return; }
  if(tg.id==='frQ'){ frPaint(); return; }
  if(tg.id==='pq'){ palIdx=0; renderPalette(tg.value); return; }
  const f=tg.dataset&&tg.dataset.itemField;
  if(f){
    const it=curItem(); if(!it) return;
    setDeep(it,f.split('.'),tg.type==='number'?(tg.value===''?0:Number(tg.value)):tg.value);
    ITEMDIRTY=true; return;
  }
  if(tg.dataset&&tg.dataset.cell){
    const p=tg.dataset.cell.split('|');
    const t=(DB.threads||[]).find(x=>x.id===p[0]); if(!t) return;
    t.cells=t.cells||{}; t.cells[p[1]]=tg.value; touch(); return;
  }
  if(tg.dataset&&tg.dataset.ev){
    const p=tg.dataset.ev.split('|');
    const ev=(DB.events||[]).find(x=>x.id===p[0]); if(!ev) return;
    ev[p[1]]=tg.value; touch(); return;
  }
  const el=tg.closest('[data-bind]'); if(!el) return;
  applyBind(el);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='ghToken'){ setToken(String(el.value||'').trim()); toast(el.value?'Token 已保存':'Token 已清除'); return; }
  if(el.dataset&&el.dataset.evch){
    const ev=(DB.events||[]).find(x=>x.id===el.dataset.evch);
    if(ev){ ev.chapterId=el.value; touch(); }
    return;
  }
  if(el.id==='avFile'){
    const f=el.files&&el.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const s=128, cv=document.createElement('canvas');
        cv.width=s; cv.height=s;
        const g=cv.getContext('2d');
        const mm=Math.min(img.width,img.height);
        g.drawImage(img,(img.width-mm)/2,(img.height-mm)/2,mm,mm,0,0,s,s);
        const en=entryBy(DB.ui.charId); if(!en) return;
        en.avatar=Object.assign({},en.avatar,{img:cv.toDataURL('image/jpeg',0.82)});
        touch(); render(); openAvatarPicker(en);
      };
      img.src=String(rd.result);
    };
    rd.readAsDataURL(f);
    return;
  }
  if(el.dataset&&el.dataset.act==='eType'){
    const en=curEntry();
    if(en&&ET[el.value]){ en.type=el.value; en.updatedAt=now(); touch(); }
    renderDrawer(); return;
  }
  if(el.dataset&&el.dataset.act==='eStatus'){
    const en=curEntry();
    if(en&&ES[el.value]){ en.status=el.value; en.updatedAt=now(); touch(); }
    renderDrawer(); return;
  }
  if(el.dataset&&(el.dataset.act==='dlgNpc'||el.dataset.act==='qType'||el.dataset.act==='qGiver'||el.dataset.act==='qStatus'||el.dataset.act==='qChapter')){
    const a=el.dataset.act;
    if(a==='dlgNpc'){
      const d=curDlg(); if(d){ d.npcId=el.value; d.updatedAt=now(); }
    }else{
      const q=curQuest();
      if(q){
        if(a==='qType') q.type=el.value;
        else if(a==='qGiver') q.giverId=el.value;
        else if(a==='qChapter') q.chapterId=el.value;
        else q.status=el.value;
        q.updatedAt=now();
      }
    }
    touch(); renderDrawer(); return;
  }
  const b=el.closest('[data-bind]'); if(b) applyBind(b);
});
document.addEventListener('keydown',e=>{
  if($('#palette').classList.contains('on')){ palKey(e); return; }
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=tag==='input'||tag==='textarea'||tag==='select';
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='h'){ e.preventDefault(); openFrModal(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){ e.preventDefault(); persist(); toast('已保存'); return; }
  if((e.key==='Delete'||e.key==='Backspace')&&DB.ui.selLink&&!typing){
    e.preventDefault();
    DB.map.links=(DB.map.links||[]).filter(l=>l.id!==DB.ui.selLink);
    DB.map.entryLinks=(DB.map.entryLinks||[]).filter(l=>l.id!==DB.ui.selLink);
    DB.ui.selLink=null; ensureMap().updatedAt=now(); touch(); render(); return;
  }
  if(e.key==='Escape'){
    if($('#modal').classList.contains('on')) return closeModal();
    if(DB.ui.zen){ DB.ui.zen=false; render(); return; }
    if(DB.ui.entryId){ DB.ui.entryId=null; render(); }
    return;
  }
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('title')){
    e.preventDefault(); const t=$('#eText'); if(t) t.focus(); return;
  }
  if(!typing&&!e.ctrlKey&&!e.metaKey){
    if(e.key.toLowerCase()==='j'){ const cs=chapters(); const i=cs.findIndex(c=>c.id===DB.ui.nodeId); if(cs[i-1]) openNodeById(cs[i-1].id); }
    if(e.key.toLowerCase()==='k'){ const cs=chapters(); const i=cs.findIndex(c=>c.id===DB.ui.nodeId); if(cs[i+1]) openNodeById(cs[i+1].id); }
  }
});
window.addEventListener('message',function(e){
  if(!DB||!e.data||e.data.type!=='gh-token') return;
  const proxy=String((DB.sync&&DB.sync.proxy)||DEFAULT_PROXY||'').trim().replace(/\/$/,'');
  if(!proxy) return;
  let ok=false;
  try{ ok=(e.origin===new URL(proxy).origin); }catch(err){ ok=false; }
  if(!ok) return;
  const t=String(e.data.token||'');
  if(!t) return;
  setToken(t);
  toast('已登录 GitHub · '+t.length+' 字符');
  render();
  setTimeout(function(){ try{ ghTest(); }catch(err){} },300);
});
window.addEventListener('error',ev=>warn('脚本错误：'+ev.message+'（'+ev.lineno+':'+ev.colno+'）'));
window.addEventListener('unhandledrejection',ev=>{
  const r=ev.reason;
  warn('后台请求失败：'+((r&&r.message)||r||'未知')+(r&&r.status?(' ['+r.status+']'):''));
});
window.addEventListener('beforeunload',()=>{ try{ if(DB) localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){} });
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){ try{ if(DB) persist(); }catch(e){} }
});
let lastSnap=Date.now();
setInterval(()=>{
  try{
    if(!DB) return;
    if(Date.now()-lastSnap>=10*60*1000 && lastSave>lastSnap){ snapshot('自动'); lastSnap=Date.now(); }
  }catch(e){}
},60*1000);

/* ---------- 启动 ---------- */
function fixEntry(e){
  if(!e||typeof e!=='object') return null;
  if(!e.id) e.id=uid('e_');
  if(!ET[e.type]) e.type='term';
  if(!ES[e.status]) e.status='draft';
  if(!Array.isArray(e.alias)) e.alias=[];
  if(!e.fields||typeof e.fields!=='object'||Array.isArray(e.fields)) e.fields={};
  if(typeof e.title!=='string') e.title='';
  if(typeof e.body!=='string') e.body='';
  e.updatedAt=e.updatedAt||now(); e.createdAt=e.createdAt||e.updatedAt;
  return e;
}
function fixNode(n){
  if(!n||typeof n!=='object') return null;
  if(!n.id) n.id=uid('n_');
  if(!NT[n.type]) n.type='chapter';
  if(typeof n.title!=='string') n.title='';
  if(typeof n.text!=='string') n.text='';
  if(typeof n.summary!=='string') n.summary='';
  n.order=n.order||0;
  n.updatedAt=n.updatedAt||now();
  return n;
}
function init(){
  DB=load();
  DB.ui=Object.assign({tab:'write',nodeId:null,entryId:null,charId:null,theme:'paper',filter:'',q:'',preview:false,zen:false,sub:'outline',collapsed:[],itemSrv:'',richEdit:true},DB.ui||{});
  if(!Array.isArray(DB.ui.collapsed)) DB.ui.collapsed=[];
  if(!Array.isArray(DB.assets)) DB.assets=[];
  if(!DB.meta) DB.meta={title:'未命名',logline:'',genre:'',form:'novel',targetWords:60000};
  if(!Array.isArray(DB.rels)) DB.rels=[];
  if(!Array.isArray(DB.events)) DB.events=[];
  if(!Array.isArray(DB.threads)) DB.threads=[];
  if(!Array.isArray(DB.dialogues)) DB.dialogues=[];
  if(!Array.isArray(DB.quests)) DB.quests=[];
  DB.dialogues.forEach(d=>{ if(!Array.isArray(d.lines)) d.lines=[]; d.updatedAt=d.updatedAt||now(); });
  DB.quests.forEach(q=>{ if(!Array.isArray(q.steps)) q.steps=[]; if(!Array.isArray(q.charIds)) q.charIds=[]; if(!QSTATUS[q.status]) q.status='idea'; q.updatedAt=q.updatedAt||now(); });
  ensureMap();
  if(!DB.ui.sub) DB.ui.sub='outline';
  if(!DB.sync||typeof DB.sync!=='object') DB.sync={};
  DB.entries=(Array.isArray(DB.entries)?DB.entries:[]).map(fixEntry).filter(Boolean);
  DB.nodes=(Array.isArray(DB.nodes)?DB.nodes:[]).map(fixNode).filter(Boolean);
  if(!DB.ui.nodeId||!nodeBy(DB.ui.nodeId)) DB.ui.nodeId=(chapters()[0]||{}).id||null;
  if(DB.ui.theme==='night') $('.themebtn').textContent='纸';
  render();
  try{
    if(DB.__cleaned||!localStorage.getItem(KEY)){ delete DB.__cleaned; persist(); }
  }catch(e){}
  if(!storageOK) warn('浏览器禁用了本地存储：修改不会被保存，请用「导出 JSON」备份。');
  try{ if(typeof indexedDB!=='undefined') bkLoad().then(()=>{ paintBk(); bkMaybe(); }); }catch(e){}
}
setTimeout(()=>{},0);
init();
</script>
